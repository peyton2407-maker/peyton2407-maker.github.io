name: Page probe
# On demand: screenshot and numbers of one live page, pushed to the "probe" branch.
on:
  workflow_dispatch:
    inputs:
      view:
        description: "Page (hash), e.g. props"
        default: "props"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture
        run: python3 scripts/page_probe.py "${{ github.event.inputs.view }}"
      - name: Push to the probe branch
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git checkout --orphan probe-tmp
          git rm -rq --cached . > /dev/null
          git add -f probe-out
          git commit -qm "Page probe: ${{ github.event.inputs.view }} $(date -u +'%a %H:%M UTC')"
          git push -f origin probe-tmp:probe
