name: Speed check
# On demand: where the live site keeps a phone's browser busy (scripts/perf_probe.py).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Measure
        run: python3 scripts/perf_probe.py
      - name: Save the report
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add data/perf-probe.json
          git commit -m "Speed check: $(date -u +'%a %H:%M UTC')" || exit 0
          for i in 1 2 3 4; do
            if git pull --rebase --quiet origin main && git push; then exit 0; fi
            sleep 8
          done
          exit 1
