name: Team logos
# Saves every team's logo to assets/logos so the site serves them itself (scripts/logos.py).
# Only new teams are downloaded, so daily runs are quick.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logos
  cancel-in-progress: false
jobs:
  logos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save team logos
        run: python3 scripts/logos.py
      - name: Commit any changes
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add -A assets/logos
          if [ -d assets/faces ]; then git add -A assets/faces; fi
          if [ -f data/logos.json ]; then git add data/logos.json; fi
          if [ -f data/faces.json ]; then git add data/faces.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Team logos: $(date -u +'%a %H:%M UTC')"
          for i in 1 2 3 4; do
            if { git pull --rebase -X theirs --quiet origin main || { git rebase --abort 2>/dev/null; false; }; } && git push; then
              exit 0
            fi
            sleep 8
          done
          exit 1
