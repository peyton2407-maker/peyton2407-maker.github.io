name: Deploy full Double Gs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - HASHMARK.html
      - upgrade_board.py
      - .github/workflows/pages.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout full board
        uses: actions/checkout@v4
        with:
          repository: peyton2407-maker/double-gs
          path: board
      - name: Upgrade board
        run: |
          mkdir -p site
          python3 upgrade_board.py
          touch site/.nojekyll .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
