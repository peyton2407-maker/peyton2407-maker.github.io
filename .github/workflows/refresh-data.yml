name: Refresh data
# Every hour: pull ESPN scoreboards (last, this and next week) and power indexes,
# update scores, lines, new games, team ratings and finals in data/snapshot.json and
# data/week-results.json. Commits only when something changed.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Refresh from ESPN
        run: python3 scripts/refresh_data.py
      - name: Map coordinates for any new stadium town
        continue-on-error: true
        run: python3 scripts/venues.py
      - name: Forecasts for the board's first paint
        # Runs the site's own weather code in headless Chromium. The injury reports and the
        # weather reports have their own job every 15 minutes (gameday.yml). Never blocks.
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/gameday.py --snapshot-only
      - name: Save this week's college polls
        continue-on-error: true
        run: python3 scripts/polls.py
      - name: Copy The Split's college picks and matchup notes to the main site
        continue-on-error: true
        run: python3 scripts/sync_split.py
      - name: Save every book's lines for the parlay builder
        # Never blocks the refresh: if the feed is down, the old file stays.
        continue-on-error: true
        run: python3 scripts/books.py
      - name: Save player-prop prices for the parlay builder
        # With an ODDS_API_KEY secret (the-odds-api.com) this uses licensed odds data from
        # DraftKings, FanDuel, BetMGM and BetRivers. Set the repository variable
        # ODDS_API_PLAN to "paid" on a paid plan for hourly updates.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_PLAN: ${{ vars.ODDS_API_PLAN }}
        run: python3 scripts/props.py
      - name: The NFL board as visitors see it (settled in the page itself)
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/settle_board.py
      - name: Season odds (ESPN's season simulation and the futures market)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/season.py
      - name: Commit any changes
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add data/snapshot.json data/week-results.json data/refresh-status.json
          if [ -f data/nfl-depth.json ]; then git add data/nfl-depth.json; fi
          if [ -f data/books.json ]; then git add data/books.json; fi
          if [ -f data/line-history.json ]; then git add data/line-history.json; fi
          git add data/desk-cfb.json data/split-notes.json data/cfb-polls.json
          if [ -f data/venues.json ]; then git add data/venues.json; fi
          if [ -f data/props.json ]; then git add data/props.json; fi
          if [ -f data/season.json ]; then git add data/season.json; fi
          if [ -f data/props-status.json ]; then git add data/props-status.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Refresh data: $(date -u +'%a %H:%M UTC')"
          for i in 1 2 3; do
            if { git pull --rebase -X theirs --quiet origin main || { git rebase --abort 2>/dev/null; false; }; } && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
