name: Refresh data
# Every 2 hours: pull ESPN scoreboards (last, this and next week) and power indexes,
# update scores, lines, new games, team ratings and finals in data/snapshot.json and
# data/week-results.json. Commits only when something changed.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Refresh from ESPN
        run: python3 scripts/refresh_data.py
      - name: Commit any changes
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add data/snapshot.json data/week-results.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Refresh data: $(date -u +'%a %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
