name: Site health
# Opens the live site in a real browser with live data and records what loaded on the
# screens that depend on live feeds (props, TDs, DraftKings lines, injuries, weather).
# Writes data/site-health.json. Runs every day before the evening games, or by hand.
on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check the live site
        run: python3 scripts/site_health.py --print
      - name: Save the report
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add data/site-health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Site health: $(date -u +'%a %H:%M UTC')"
          for i in 1 2 3; do
            if { git pull --rebase -X theirs --quiet origin main || { git rebase --abort 2>/dev/null; false; }; } && git push; then exit 0; fi
            sleep 5
          done
          exit 1
