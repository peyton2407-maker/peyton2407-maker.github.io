name: Lock picks
# Every 15 minutes: open the live board, lock any pick / play of the day / weekly card
# whose kickoff is 90 minutes away or less, grade finished plays of the day, and move
# finished weeks into the past scorecards. Commits only when something changed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lock-picks
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # main as it is now, not the commit this run was queued on: a run that waited behind
      # another lock run must start from that run's locks, or it re-picks on stale data
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        run: |
          pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Lock, grade and archive
        run: |
          git pull --quiet --ff-only origin main || true
          cp data/locks.json "$RUNNER_TEMP/locks-before.json"
          python3 scripts/lock_runner.py
      - name: Commit any new locks
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git add data/locks.json data/past-scorecards.json
          if [ -f data/model-report.json ]; then git add data/model-report.json; fi
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "Lock picks: $(date -u +'%a %H:%M UTC')"
          for i in 1 2 3; do
            if { git pull --rebase -X theirs --quiet origin main || { git rebase --abort 2>/dev/null; false; }; } && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Phone alerts (only after the push landed, so a retried push never alerts twice)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/alerts.py --diff "$RUNNER_TEMP/locks-before.json" data/locks.json
