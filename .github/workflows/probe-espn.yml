name: Probe ESPN feeds (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          mkdir -p probe
          ua="Mozilla/5.0 (Double Gs probe)"
          get() { curl -sS -m 40 -A "$ua" "$2" -o "probe/$1.json" || echo "fail $1"; ls -la "probe/$1.json"; }
          get scoreboard "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?week=8&seasontype=2&groups=80&limit=300"
          get team_stats_site "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/61/statistics"
          get team_stats_core "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/teams/61/statistics"
          get team_stats_core_opp "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/teams/61/statistics/1"
          get team_record "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/teams/61/record"
          get team_leaders "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/2026/types/2/teams/61/leaders"
          get team_site "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/61"
          get fpi "https://site.web.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?limit=150"
          get fpi_site "https://site.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?limit=150"
          get teams_list "https://site.api.espn.com/apis/site/v2/sports/football/college-football/groups/80/teams?limit=200"
          get teams_all "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams?groups=80&limit=200"
          get stats_league "https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/statistics/byteam?region=us&lang=en&contentorigin=espn&isqualified=true&page=1&limit=200&category=offense&sort=passing.netPassingYardsPerGame%3Adesc&season=2026&seasontype=2&groups=80"
          get stats_league_def "https://site.web.api.espn.com/apis/common/v3/sports/football/college-football/statistics/byteam?region=us&lang=en&contentorigin=espn&isqualified=true&page=1&limit=200&category=defense&season=2026&seasontype=2&groups=80"
          get summary "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=401856719"
          for f in probe/*.json; do python3 -c "import json,sys; d=json.load(open('$f')); print('$f', type(d).__name__, list(d)[:12] if isinstance(d,dict) else len(d))" || head -c 300 "$f"; done
      - name: Push samples to the probe branch
        run: |
          git config user.name "peyton2407-maker"
          git config user.email "331867039+peyton2407-maker@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rq --cached . >/dev/null
          git add probe
          git commit -qm "ESPN feed samples"
          git push -f origin probe
