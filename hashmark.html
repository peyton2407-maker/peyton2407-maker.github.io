<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HASHMARK — NFL & CFB desk</title>
<style>:root {
  --bg: #070806;
  --bg-2: #10140f;
  --panel: #141a13;
  --panel-2: #1b2319;
  --line: #2a3528;
  --line-2: #3d4a38;
  --turf: #8bd16a;
  --turf-dim: #4d7a3c;
  --amber: #e8b84a;
  --amber-2: #f3d48a;
  --red: #ff6b5a;
  --blue: #7eb6ff;
  --text: #eef3ea;
  --muted: #9aa894;
  --faint: #6b7367;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --radius: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Geist", "Segoe UI", "Helvetica Neue", sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(139, 209, 106, 0.08), transparent 50%),
    radial-gradient(900px 400px at 90% 0%, rgba(232, 184, 74, 0.06), transparent 45%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button, input, select { font: inherit; color: inherit; }

.app { max-width: 1280px; margin: 0 auto; padding: 20px 20px 80px; }

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 22px;
}
.brand { display: flex; gap: 12px; align-items: center; }
.mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(160deg, #b6e88f, #4e8a38);
  color: #10140f;
  display: grid; place-items: center;
  font-weight: 800; letter-spacing: -0.04em;
  box-shadow: 0 0 0 4px rgba(139, 209, 106, 0.12);
}
.brand h1 {
  margin: 0; font-size: 22px; letter-spacing: 0.18em; font-weight: 750;
}
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }

.meta-chip {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  color: var(--muted); font-size: 12px;
}
.pill {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 6px 10px; border-radius: 999px;
}

.tabs {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
}
.tab {
  background: transparent;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--muted);
}
.tab.active {
  background: var(--turf);
  color: #10200c;
  border-color: var(--turf);
  font-weight: 700;
}

.controls {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
}
.controls input, .controls select {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  min-width: 160px;
}
.controls input { flex: 1; min-width: 220px; }

.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.stat b { display: block; font-size: 22px; color: var(--amber-2); }
.stat span { color: var(--muted); font-size: 12px; }

.board { display: grid; gap: 10px; }

.game {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  align-items: start;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.scorebox {
  background: #0c100b;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}
.scoreline {
  display: flex;
  justify-content: center;
  gap: 12px;
  align-items: baseline;
  font-size: 15px;
  margin-top: 4px;
}
.scoreline b { font-size: 28px; color: var(--amber-2); font-weight: 800; }
.score-dash { color: var(--faint); }
.total-line { text-align: center; color: var(--muted); font-size: 13px; margin-top: 4px; }
.total-line b { color: var(--text); }
.total-line span { color: var(--faint); }
.yardgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.yardgrid > div {
  background: #0c100b;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
}
.yardgrid b { display: block; font-size: 18px; margin-top: 2px; }
.prop-preview {
  color: var(--turf);
  font-size: 13px;
  font-weight: 650;
}
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.boardtable { width: 100%; border-collapse: collapse; min-width: 640px; }
.boardtable th, .boardtable td {
  text-align: left; padding: 8px 7px; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap;
}
.boardtable th { color: var(--faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.boardtable tr[data-id] { cursor: pointer; }
.boardtable tr[data-id]:hover td { background: rgba(255,255,255,0.03); }
.board-card { margin-bottom: 14px; }
.simgrid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 8px;
}
.simgrid > div {
  background: #0c100b;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
}
.simgrid b { display: block; font-size: 13px; margin-top: 2px; }
.simtails { color: var(--faint); font-size: 12px; }
@media (max-width: 640px) {
  .simgrid { grid-template-columns: 1fr 1fr; }
}
.game:hover { border-color: var(--line-2); background: var(--panel-2); }
.game.live { outline: 1px solid rgba(139, 209, 106, 0.35); }

.matchup { display: flex; flex-direction: column; gap: 8px; }
.team {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 8px; align-items: center;
}
.team img { width: 28px; height: 28px; object-fit: contain; }
.team .name { font-weight: 650; }
.team .sub { color: var(--faint); font-size: 12px; }
.rank {
  color: var(--amber); font-size: 11px; font-weight: 700; margin-right: 6px;
}

.kick { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.yards { color: var(--faint); font-size: 11px; letter-spacing: 0.01em; }

.linebox, .edgebox {
  border-left: 1px solid var(--line);
  padding-left: 14px;
}
.lbl { font-size: 11px; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; }
.num { font-size: 18px; font-weight: 700; margin-top: 2px; }
.subn { font-size: 12px; color: var(--muted); }

.edge-pos { color: var(--turf); }
.edge-neg { color: var(--amber); }
.badge {
  display: inline-block;
  margin-top: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}
.badge.play { background: rgba(139, 209, 106, 0.16); color: var(--turf); }
.badge.pass { background: rgba(255,255,255,0.05); color: var(--faint); }
.badge.over { background: rgba(126, 182, 255, 0.14); color: var(--blue); }

.done { opacity: 0.62; }

.ratings { width: 100%; border-collapse: collapse; }
.ratings th, .ratings td {
  text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13px;
}
.ratings th { color: var(--faint); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.ratings tr:hover td { background: rgba(255,255,255,0.02); }
.rteam { display: flex; gap: 8px; align-items: center; font-weight: 650; }
.rteam img { width: 22px; height: 22px; }

.model, .news {
  display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 14px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.card h3 { margin: 0 0 10px; }
.card p, .card li { color: var(--muted); line-height: 1.55; }
.news-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.news-item a { color: var(--text); text-decoration: none; font-weight: 650; }
.news-item a:hover { color: var(--turf); }
.news-item small { color: var(--faint); display: block; margin-top: 4px; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20;
}
.overlay.show { display: flex; }
.modal {
  width: min(820px, 100%);
  max-height: 90vh; overflow: auto;
  background: #121710;
  border: 1px solid var(--line-2);
  border-radius: 20px;
  padding: 22px;
  box-shadow: var(--shadow);
}
.modal-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.close {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 10px; cursor: pointer;
}
.vs {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
  margin: 18px 0;
}
.side { text-align: center; }
.side img { width: 64px; height: 64px; }
.side h2 { margin: 8px 0 0; font-size: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.props { width: 100%; border-collapse: collapse; }
.props th, .props td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
.props th { color: var(--faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.inj { color: var(--amber); font-size: 10px; font-weight: 700; margin-left: 6px; }
.kv b { display: block; font-size: 18px; }
.props { width: 100%; border-collapse: collapse; margin-top: 8px; }
.props th, .props td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 12px; }
.props th { color: var(--faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.inj { color: var(--amber); font-size: 10px; font-weight: 700; margin-left: 6px; }

.empty { color: var(--muted); padding: 40px 10px; text-align: center; }

@media (max-width: 900px) {
  .game { grid-template-columns: 1fr; }
  .linebox, .edgebox { border-left: 0; padding-left: 0; }
  .yardgrid { grid-template-columns: repeat(2, 1fr); }
  .stat-row, .model, .news, .grid2, .vs { grid-template-columns: 1fr; }
}

@media (min-width: 901px) {
  .game { grid-template-columns: 1.25fr .9fr 1.2fr .75fr; align-items: center; }
  .prop-preview, .simgrid, .simtails { grid-column: 1 / -1; }
}
.desk-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:5px; border:1px solid rgba(139,209,106,.35); border-radius:999px; background:rgba(7,8,6,.72); margin-bottom:16px; }
.desk-switch a { display:block; text-align:center; text-decoration:none; border-radius:999px; padding:12px 16px; font-weight:800; color:#d7e7da; }
.desk-switch a.on { background:#c6ef63; color:#12210f; }
</style>
</head>

  <div class="stat-row" id="stats"></div>
  <div id="board"></div>
</div>

<script>
const DATA = window.DESK;
let view = "nfl";
const $ = (s) => document.querySelector(s);
function n(v){ const x=Number(v); return Number.isFinite(x)?String(Math.round(x)):"—"; }
function signed(v){ const x=Number(v); if(!Number.isFinite(x)) return "—"; return (x>0?"+":"")+x.toFixed(1); }
function when(iso){
  try { return new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(iso)); }
  catch(e){ return iso||""; }
}
function cfbLine(g){
  const hf=g.fpiH, af=g.fpiA;
  let hfa=g.neutral?0:2.75;
  if(g.country && !["","USA","US","United States"].includes(g.country) && !g.neutral) hfa*=0.35;
  const model=(hf!=null&&af!=null)?hf-af+hfa:null;
  const mkt=g.spread!=null?-Number(g.spread):null;
  const mw=0.52;
  let margin=null;
  if(model!=null&&mkt!=null) margin=mw*mkt+(1-mw)*model;
  else margin=model!=null?model:mkt;
  const gap=Math.abs((hf||0)-(af||0));
  const modelTotal=model!=null?53.8+Math.min(6,gap*0.08):null;
  const mktT=g.total!=null?Number(g.total):null;
  let total=null;
  if(modelTotal!=null&&mktT!=null) total=mw*mktT+(1-mw)*modelTotal;
  else total=modelTotal!=null?modelTotal:mktT;
  if(margin==null||total==null) return null;
  const home=Math.max(3,(total+margin)/2), away=Math.max(3,(total-margin)/2);
  let ar=g.ar, ac=g.ac, hr=g.hr, hc=g.hc;
  if(g.hr!=null&&g.dgH&&g.dgA){
    const kH=home/g.dgH, kA=away/g.dgA;
    hr=g.hr*kH; hc=g.hc*kH; ar=g.ar*kA; ac=g.ac*kA;
  }
  const edge=mkt!=null?margin-mkt:null;
  return {away:+away.toFixed(1), home:+home.toFixed(1), total:+total.toFixed(1), ar, ac, hr, hc, hmSpread:+(-margin).toFixed(1), edge};
}
function shown(g){
  if(g.league==="cfb") return cfbLine(g);
  if(g.dgA==null||g.dgH==null) return null;
  return {away:g.dgA, home:g.dgH, total:+((g.dgA+g.dgH).toFixed(1)), ar:g.ar, ac:g.ac, hr:g.hr, hc:g.hc, hmSpread:g.hmSpread, edge:g.edge};
}
function gamesNow(){
  const q=($("#q").value||"").trim().toLowerCase();
  return DATA.games.filter(g=>{
    if(view!=="all" && g.league!==view) return false;
    if(!q) return true;
    return (g.short+" "+g.name+" "+g.away.abbr+" "+g.home.abbr+" "+g.away.name+" "+g.home.name).toLowerCase().includes(q);
  }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function teamLine(t, spread){
  const rank=t.rank&&t.rank!==99?`<span class="rank">#${t.rank}</span>`:"";
  return `<div class="team"><img src="${t.logo||""}" alt="" onerror="this.style.opacity=0"><div><div class="name">${rank}${t.name}</div><div class="sub">${t.abbr}${t.record?" · "+t.record:""}</div></div><div class="sub">${spread||""}</div></div>`;
}
function card(g){
  const line=shown(g);
  const wx=g.temp!=null?`${g.temp}°F · wind ${g.wind||0}`:(g.indoor?"Indoor":"");
  const edge=line?line.edge:null;
  let badge=`<span class="badge pass">market aligned</span>`;
  if(line && edge!=null && g.spread!=null && Math.abs(edge)>=0.6){
    const play=edge>0
      ? `${g.home.abbr} ${g.spread>=0?"+":""}${Number(g.spread).toFixed(1)}`
      : `${g.away.abbr} ${(-g.spread)>=0?"+":""}${(-g.spread).toFixed(1)}`;
    badge=`<span class="badge play">${play}</span>`;
  }
  const awayPts=line?line.away:"—", homePts=line?line.home:"—", tot=line?line.total:"—";
  return `<article class="game" data-id="${g.id}">
    <div class="matchup">
      <div class="kick">${g.league.toUpperCase()} · ${when(g.date)}${g.tv?" · "+g.tv:""}${wx?" · "+wx:""}</div>
      ${teamLine(g.away, g.awayFav?g.line:"")}
      ${teamLine(g.home, g.homeFav?g.line:"")}
    </div>
    <div class="scorebox">
      <div class="lbl">Projected score</div>
      <div class="scoreline"><span>${g.away.abbr} <b>${awayPts}</b></span><span class="score-dash">–</span><span><b>${homePts}</b> ${g.home.abbr}</span></div>
      <div class="total-line">Total <b>${tot}</b> <span>market ${g.total!=null?g.total:"—"}</span></div>
    </div>
    <div class="yardgrid">
      <div><span class="lbl">${g.away.abbr} rush</span><b>${line?n(line.ar):"—"}</b></div>
      <div><span class="lbl">${g.away.abbr} rec</span><b>${line?n(line.ac):"—"}</b></div>
      <div><span class="lbl">${g.home.abbr} rush</span><b>${line?n(line.hr):"—"}</b></div>
      <div><span class="lbl">${g.home.abbr} rec</span><b>${line?n(line.hc):"—"}</b></div>
    </div>
    <div class="linebox">
      <div class="lbl">Market / Hashmark</div>
      <div class="num">${g.line||"No line"}</div>
      <div class="subn">HM ${g.home.abbr} ${line?signed(line.hmSpread):"—"} · edge ${line?signed(line.edge):"—"}</div>
      ${badge}
    </div>
  </article>`;
}
function table(rows){
  return `<div class="card board-card"><h3 style="margin:0 0 10px">All games</h3>
    <div class="tablewrap"><table class="boardtable"><thead><tr>
      <th>Kick</th><th>Matchup</th><th>Proj score</th><th>Tot</th>
      <th>Away rush</th><th>Away rec</th><th>Home rush</th><th>Home rec</th><th>Line</th>
    </tr></thead><tbody>${rows.map(g=>{
      const line=shown(g);
      if(!line) return `<tr data-id="${g.id}"><td>${when(g.date)}</td><td>${g.away.abbr} @ ${g.home.abbr}</td><td colspan="7">FCS opponent and no posted line, so the score stays blank.</td></tr>`;
      return `<tr data-id="${g.id}"><td>${when(g.date)}</td><td>${g.away.abbr} @ ${g.home.abbr}</td><td><b>${line.away}–${line.home}</b></td><td>${line.total}</td><td>${n(line.ar)}</td><td>${n(line.ac)}</td><td>${n(line.hr)}</td><td>${n(line.hc)}</td><td>${g.line||"—"}</td></tr>`;
    }).join("")}</tbody></table></div></div>`;
}
function render(){
  const rows=gamesNow();
  const priced=rows.filter(shown);
  $("#stats").innerHTML=`
    <div class="stat"><b>${rows.length}</b><span>games on this board</span></div>
    <div class="stat"><b>${priced.length}</b><span>with score + yard projections</span></div>
    <div class="stat"><b>${priced.filter(g=>shown(g)&&Math.abs(shown(g).edge||0)>=0.6).length}</b><span>spread leans ≥ 0.6 pts</span></div>
    <div class="stat"><b>${rows.filter(g=>g.league==="cfb").length}</b><span>college games in view</span></div>`;
  const cards=rows.map(card).join("");
  $("#board").innerHTML=`<div class="board">${cards}</div>`+table(rows);
}
function openGame(id){
  const g=DATA.games.find(x=>String(x.id)===String(id));
  if(!g) return;
  $("#modal").innerHTML=`<div class="modal-head"><div><div class="lbl">${g.league.toUpperCase()}</div><div class="kick">${when(g.date)} · ${g.venue||""} ${g.city?"· "+g.city:""} ${g.state||""}</div></div><button class="close" id="closeModal" type="button">Close</button></div>`+card(g);
  $("#overlay").classList.add("show");
  $("#closeModal").onclick=()=>$("#overlay").classList.remove("show");
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  view=t.dataset.view;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b===t));
  render();
}));
$("#q").addEventListener("input", render);
$("#board").addEventListener("click",(e)=>{
  const el=e.target.closest("[data-id]");
  if(el) openGame(el.getAttribute("data-id"));
});
$("#overlay").addEventListener("click",(e)=>{ if(e.target.id==="overlay") $("#overlay").classList.remove("show"); });
const wk=(DATA.meta&&DATA.meta.nfl_week)||"";
$("#stamp").textContent=wk?("NFL week "+wk):"Desk";
render();
</script>
</body>
</html>
