<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root { --bg:#070807; --card:#121612; --line:#2a3128; --ink:#f4f7f2; --muted:#9aa396; --faint:#6f786e; --lime:#d7f34a; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:Outfit, "Segoe UI", sans-serif; }
button, input { font:inherit; color:inherit; }
.switch { display:grid; grid-template-columns:1fr 1fr; background:#101410; }
.switch a { text-align:center; text-decoration:none; padding:16px 12px; color:#d5ddd4; font-weight:650; }
.switch a.on { background:var(--lime); color:#14200c; font-weight:800; }
.wrap { width:min(600px, 100%); margin:0 auto; padding:28px 16px 80px; }
.head { display:flex; gap:12px; align-items:flex-start; justify-content:center; }
.bars { display:flex; gap:4px; padding-top:6px; }
.bars i { display:block; width:4px; height:22px; border-radius:2px; background:var(--lime); }
.head h1 { margin:0; font-size:34px; letter-spacing:.04em; font-weight:800; line-height:1; }
.kicker { margin:6px 0 0; text-align:center; letter-spacing:.18em; font-size:12px; color:#c9d2c8; }
.lede { color:var(--muted); font-size:14.5px; line-height:1.5; text-align:center; margin:18px 0 20px; }
.mode { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#1a1f1a; border-radius:999px; padding:5px; margin-bottom:12px; }
.mode button, .pills button { border:0; cursor:pointer; background:transparent; }
.mode button { border-radius:999px; padding:12px 10px; font-weight:750; color:#c5cec4; }
.mode button.on { background:var(--lime); color:#14200c; }
.search { width:100%; background:#161b16; border:1px solid #2c332c; border-radius:16px; padding:14px 16px; margin-bottom:14px; outline:none; }
.search::placeholder { color:#8b948a; }
.row { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.pills { display:flex; gap:8px; }
.pills button { border-radius:999px; padding:8px 14px; background:#2a312b; color:#d5ddd4; font-weight:700; }
.pills button.on { background:var(--lime); color:#14200c; }
.count { margin-left:auto; color:var(--faint); font-size:13px; }
.list { display:grid; gap:12px; }
.card { background:var(--card); border:1px solid #2c342c; border-radius:18px; overflow:hidden; }
.bar { height:4px; }
.body { padding:14px 16px 12px; }
.when { color:#c5cdc4; font-size:12px; letter-spacing:.08em; font-weight:700; margin-bottom:10px; }
.team { display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; margin:8px 0; }
.team img { width:32px; height:32px; object-fit:contain; }
.name { font-weight:800; font-size:18px; }
.home { color:var(--muted); font-weight:500; font-size:13px; margin-left:6px; }
.meta { color:var(--muted); font-size:13px; margin-top:1px; }
.line { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; font-size:22px; font-weight:800; }
.ou { font-weight:650; font-size:18px; }
.fpi { margin-top:12px; padding-top:10px; border-top:1px solid #2a3128; color:var(--faint); font-size:13px; }
.sheet { margin-top:8px; display:grid; gap:8px; }
.sheet p { margin:0; color:#d5ddd2; font-size:14.5px; line-height:1.45; }
.empty { color:var(--muted); text-align:center; padding:28px 8px; }
</style>
</head>
<body>
<nav class="switch" aria-label="Which desk">

</nav>
<main class="wrap">
  <div class="head">
    <span class="bars" aria-hidden="true"><i></i><i></i></span>
    <h1>THE SPLIT</h1>
  </div>
  <p class="kicker">2026 COLLEGE FOOTBALL</p>
  <p class="lede">Week 4 matchup sheets. The live numbers are this season. Every stat from the full sheet is explained in plain English, including the ones a public feed cannot fill in. College only — NFL stays on Double Gs.</p>
  <div class="mode">
    <button type="button" class="on" data-mode="week">This week</button>
    <button type="button" data-mode="sheet">Every stat</button>
  </div>
  <input class="search" id="q" placeholder="Find a team" />
  <div class="row">
    <div class="pills">
      <button type="button" class="on" data-slate="ranked">Ranked</button>
      <button type="button" data-slate="all">Full slate</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
</main>

<script>
const GAMES = window.WEEK;
let mode = "week";
let slate = "ranked";
const $ = (s) => document.querySelector(s);
function num(v) {
  const x = Math.abs(Number(v));
  if (!Number.isFinite(x)) return "";
  const r = Math.round(x * 10) / 10;
  return Math.abs(r - Math.round(r)) < 0.05 ? String(Math.round(r)) : r.toFixed(1);
}
function when(iso) {
  try {
    return new Intl.DateTimeFormat("en-US", { timeZone:"America/New_York", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }).format(new Date(iso)).toUpperCase();
  } catch (e) { return iso || ""; }
}
function hfa(g) {
  let n = g.neutral ? 0 : 2.75;
  if (g.country && !["", "USA", "US", "United States"].includes(g.country) && !g.neutral) n *= 0.35;
  return n;
}
function modelMargin(g) {
  if (g.fpiH == null || g.fpiA == null) return null;
  return g.fpiH - g.fpiA + hfa(g);
}
function book(g) {
  const ou = g.total != null ? "O/U " + num(g.total) : "";
  if (g.spread == null) return { text: "No line", ou };
  if (Math.abs(g.spread) < 0.05) return { text: "PK", ou };
  const fav = g.spread < 0 ? g.home : g.away;
  return { text: fav.abbr + " -" + num(g.spread), ou };
}
function fpiText(g) {
  const m = modelMargin(g);
  if (m == null) return "FPI lean isn't posted for this game.";
  const fav = m >= 0 ? g.home : g.away;
  return "FPI lean " + fav.abbr + " -" + num(m);
}
function sheet(g) {
  const m = modelMargin(g);
  const bits = [];
  if (g.spread == null) bits.push("No point spread is posted, so the book side of this sheet stays blank.");
  else if (Math.abs(g.spread) < 0.05) bits.push("The book has this game as a pick. The total is " + (g.total != null ? num(g.total) : "not posted") + ".");
  else {
    const fav = g.spread < 0 ? g.home : g.away;
    const dog = g.spread < 0 ? g.away : g.home;
    bits.push("The book has " + fav.name + " laying " + num(g.spread) + ". " + dog.name + " is getting the points. The total is " + (g.total != null ? num(g.total) : "not posted") + ".");
  }
  if (m == null) bits.push("A team rating is not posted for both sides, so there is no FPI lean.");
  else {
    const fav = m >= 0 ? g.home : g.away;
    bits.push("Before the book is mixed in, the team rating has " + fav.name + " by " + num(m) + (g.neutral ? " on a neutral field." : " with home field in it."));
  }
  if (m != null && g.spread != null) {
    const mkt = -Number(g.spread);
    const margin = 0.52 * mkt + 0.48 * m;
    const gap = Math.abs((g.fpiH || 0) - (g.fpiA || 0));
    const modelTotal = 53.8 + Math.min(6, gap * 0.08);
    const total = g.total != null ? 0.52 * Number(g.total) + 0.48 * modelTotal : modelTotal;
    const home = Math.max(3, (total + margin) / 2);
    const away = Math.max(3, (total - margin) / 2);
    bits.push("Mixing the book with the rating, the score is " + g.away.name + " " + away.toFixed(1) + ", " + g.home.name + " " + home.toFixed(1) + ". The total is " + total.toFixed(1) + ".");
  }
  if (g.ar != null && g.hr != null) {
    bits.push(g.away.name + " is " + g.ar + " rushing yards and " + g.ac + " receiving yards. " + g.home.name + " is " + g.hr + " rushing and " + g.hc + " receiving.");
  }
  if (g.indoor) bits.push("This one is indoors, so weather is not in the number.");
  else if (g.temp != null) bits.push("The weather on the feed is " + g.temp + "°F and the wind is " + (g.wind || 0) + " mph.");
  bits.push("Success rate, havoc, and stuff rate are not in a public feed, so they are not given a number.");
  return `<div class="sheet">${bits.map((p) => `<p>${p}</p>`).join("")}</div>`;
}
function teamRow(t, home) {
  const rank = t.rank ? "#" + t.rank + " " : "";
  const meta = [t.record, t.conf].filter(Boolean).join(" · ");
  return `<div class="team"><img src="${t.logo}" alt=""><div><div class="name">${rank}${t.name}${home ? ` <span class="home">home</span>` : ""}</div><div class="meta">${meta}</div></div></div>`;
}
function card(g) {
  const b = book(g);
  const color = `linear-gradient(90deg,#${g.away.color || "8bd16a"},#${g.home.color || "d7f34a"})`;
  return `<article class="card">
    <div class="bar" style="background:${color}"></div>
    <div class="body">
      <div class="when">${when(g.date)}</div>
      ${teamRow(g.away, false)}
      ${teamRow(g.home, true)}
      <div class="line"><span>${b.text}</span><span class="ou">${b.ou}</span></div>
      <div class="fpi">${fpiText(g)}</div>
      ${mode === "sheet" ? sheet(g) : ""}
    </div>
  </article>`;
}
function gamesNow() {
  const q = ($("#q").value || "").trim().toLowerCase();
  return GAMES.filter((g) => {
    if (slate === "ranked" && !(g.home.rank || g.away.rank)) return false;
    if (!q) return true;
    return (g.home.name + " " + g.away.name + " " + g.home.abbr + " " + g.away.abbr + " " + g.home.conf + " " + g.away.conf).toLowerCase().includes(q);
  }).sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
function render() {
  const rows = gamesNow();
  $("#count").textContent = rows.length + (rows.length === 1 ? " game" : " games");
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty">No game matches.</div>`;
}
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
  render();
}));
document.querySelectorAll("[data-slate]").forEach((b) => b.addEventListener("click", () => {
  slate = b.dataset.slate;
  document.querySelectorAll("[data-slate]").forEach((x) => x.classList.toggle("on", x === b));
  render();
}));
$("#q").addEventListener("input", render);
render();
</script>
