:root { --bg:#0d1628; --surface:#141f36; --surface-2:#1b2945; --fg:#edf1f7; --muted:#8d99b1; --chalk:#f2b840; --good:#3cc47e; --bad:#f2545b; --line:rgba(237,241,247,.09); --line-2:rgba(237,241,247,.18); --brass:#e0a531; --brass-ink:#241602; --flame:#ff6a33; --display:"Big Shoulders Display","Barlow Condensed",Impact,sans-serif; --body:Barlow,"Segoe UI",system-ui,sans-serif; --safe-b:env(safe-area-inset-bottom, 10px); }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); }
button, input { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
a { color:inherit; }
.display { font-family:var(--display); font-weight:800; letter-spacing:.01em; }
.wrap { width:min(48rem, 100%); margin:0 auto; padding:16px 16px 64px; }
.row { display:flex; align-items:center; gap:12px; }
.kicker { display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
h1 { margin:0; font-size:30px; line-height:1; font-weight:600; }
.lede { margin:12px 0 0; max-width:36rem; color:var(--muted); font-size:14px; line-height:1.6; }
.toggle { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:16px; padding:4px; border-radius:999px; background:var(--surface); }
.toggle button, .pills button { min-height:44px; border-radius:999px; }
.toggle button.on, .pills button.on { background:var(--chalk); color:var(--bg); font-weight:650; }
.toggle button.off, .pills button.off { color:var(--muted); font-weight:500; }
.search { width:100%; margin-top:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:12px; outline:none; }
.pills { display:flex; gap:8px; align-items:center; margin-top:12px; }
.pills button { padding:8px 12px; background:var(--surface); font-size:14px; }
.count { margin-left:auto; color:var(--muted); font-size:12px; }
.list { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.card { display:block; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit; }
.bar { height:4px; }
.meta { display:flex; justify-content:space-between; padding:12px 12px 0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.side { display:flex; align-items:center; gap:8px; padding:8px 12px; }
.side img, .logo { width:32px; height:32px; object-fit:contain; }
.fallback { display:grid; place-items:center; width:32px; height:32px; border-radius:999px; color:var(--bg); font-size:14px; }
.team { font-size:20px; line-height:1.1; }
.rankn { color:var(--chalk); margin-right:4px; font-size:18px; }
.home { margin-left:8px; font-size:12px; color:var(--muted); font-family:var(--body); letter-spacing:0; }
.sub { font-size:12px; color:var(--muted); }
.score { margin-left:auto; font-size:24px; }
.line { display:flex; justify-content:space-between; align-items:baseline; padding:0 12px 12px; font-size:20px; }
.line .ou { color:var(--muted); }
.fpi { border-top:1px solid var(--line); padding:8px 12px; font-size:12px; color:var(--muted); }
.empty { margin-top:24px; color:var(--muted); }
.back { color:var(--muted); text-decoration:none; font-size:14px; }
.sheet-meta { margin:8px 0 0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.head { margin-top:12px; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.head .bar { height:6px; }
.panes { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; }
.pane .logo, .pane img { width:48px; height:48px; }
.abbr { margin-top:8px; font-size:24px; line-height:1; }
.leaders { margin:8px 0 0; padding:0; list-style:none; }
.leaders li { font-size:12px; color:var(--muted); margin-top:4px; }
.desk { margin-top:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:12px; }
.desk .tag { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); }
.desk .pts { margin-top:4px; font-size:30px; line-height:1; }
.desk p { margin:8px 0 0; font-size:14px; color:var(--muted); }
.desk a { display:inline-grid; place-items:center; margin-top:12px; min-height:44px; padding:8px 16px; border-radius:999px; background:var(--brass); color:var(--bg); font-weight:650; font-size:14px; text-decoration:none; }
.sec { margin-top:16px; }
.sec h2, .guide h2 { margin:0; font-size:20px; text-transform:uppercase; color:var(--chalk); }
.note { margin:0 0 8px; font-size:14px; color:var(--muted); }
.box { overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.statbtn { width:100%; padding:12px; text-align:left; border-bottom:1px solid var(--line); }
.box .statbtn:last-child { border-bottom:0; }
.statgrid { display:flex; align-items:flex-start; gap:8px; }
.cell { flex:1; min-width:0; }
.cell.right { text-align:right; }
.num { font-size:24px; line-height:1; }
.num.good, .good { color:var(--good); }
.num.bad, .bad { color:var(--bad); }
.cap { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:4px; font-size:12px; color:var(--muted); }
.right .cap { justify-content:flex-end; }
.midname { width:7rem; flex:none; padding-top:4px; text-align:center; font-size:14px; line-height:1.15; text-transform:uppercase; }
.pill { display:inline-flex; min-height:20px; min-width:32px; align-items:center; justify-content:center; border-radius:4px; padding:0 4px; font-size:14px; line-height:1; }
.pill.good { background:var(--good); color:var(--bg); }
.pill.bad { background:var(--bad); color:var(--bg); }
.pill.mid { background:var(--surface-2); color:var(--fg); }
.explain { border-top:1px solid var(--line); padding:12px; font-size:14px; line-height:1.6; }
.explain p { margin:0; }
.explain .gap { margin-top:8px; }
.lineblock { margin-top:16px; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.lineblock h2 { padding:12px 12px 0; }
.lineblock .note { padding:0 12px 12px; border-bottom:1px solid var(--line); }
.lbl { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.val { font-size:24px; line-height:1.15; }
.foot { margin-top:32px; font-size:12px; line-height:1.6; color:var(--muted); }
.guide h2 { position:sticky; top:0; background:var(--bg); padding:8px 0; }
.ghead { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.gname { font-size:20px; line-height:1; text-transform:uppercase; }
.live { font-size:12px; color:var(--chalk); }

.site-switch a{display:grid;place-items:center;min-height:44px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:#97a0b2}
.site-switch a.on{background:#e4ff4a;color:#0c1017;font-weight:700}
.site-banner{display:block;width:100%;max-height:160px;object-fit:cover;object-position:center}

/* The Split content in the shared style */
h1 { font-family: var(--display); font-weight: 900; letter-spacing: .01em; }
