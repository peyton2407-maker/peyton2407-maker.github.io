:root { --bg:#0d1628; --surface:#141f36; --surface-2:#1b2945; --fg:#edf1f7; --muted:#8d99b1; --chalk:#f2b840; --good:#3cc47e; --bad:#f2545b; --line:rgba(237,241,247,.09); --line-2:rgba(237,241,247,.18); --brass:#e0a531; --brass-ink:#241602; --flame:#ff6a33; --display:"Big Shoulders Display","Barlow Condensed",Impact,sans-serif; --body:Barlow,"Segoe UI",system-ui,sans-serif; --safe-b:env(safe-area-inset-bottom, 10px); }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--body); }
button, input { font:inherit; color:inherit; }
button { background:none; border:0; cursor:pointer; }
a { color:inherit; }
.display { font-family:var(--display); font-weight:800; letter-spacing:.01em; }
.wrap { width:min(48rem, 100%); margin:0 auto; padding:16px 16px 64px; }
.row { display:flex; align-items:center; gap:12px; }
.kicker { display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
h1 { margin:0; font-size:30px; line-height:1; font-weight:600; }
.lede { margin:12px 0 0; max-width:36rem; color:var(--muted); font-size:14px; line-height:1.6; }
.toggle { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:16px; padding:4px; border-radius:999px; background:var(--surface); }
.toggle button, .pills button { min-height:44px; border-radius:999px; }
.toggle button.on, .pills button.on { background:var(--chalk); color:var(--bg); font-weight:650; }
.toggle button.off, .pills button.off { color:var(--muted); font-weight:500; }
.search { width:100%; margin-top:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:12px; outline:none; }
.pills { display:flex; gap:8px; align-items:center; margin-top:12px; }
.pills button { padding:8px 12px; background:var(--surface); font-size:14px; }
.count { margin-left:auto; color:var(--muted); font-size:12px; }
.list { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.card { display:block; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit; }
.bar { height:4px; }
.meta { display:flex; justify-content:space-between; padding:12px 12px 0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.side { display:flex; align-items:center; gap:8px; padding:8px 12px; }
.side img, .logo { width:32px; height:32px; object-fit:contain; }
.fallback { display:grid; place-items:center; width:32px; height:32px; border-radius:999px; color:var(--bg); font-size:14px; }
.team { font-size:20px; line-height:1.1; }
.rankn { color:var(--chalk); margin-right:4px; font-size:18px; }
.home { margin-left:8px; font-size:12px; color:var(--muted); font-family:var(--body); letter-spacing:0; }
.sub { font-size:12px; color:var(--muted); }
.score { margin-left:auto; font-size:24px; }
.line { display:flex; justify-content:space-between; align-items:baseline; padding:0 12px 12px; font-size:20px; }
.line .ou { color:var(--muted); }
.fpi { border-top:1px solid var(--line); padding:8px 12px; font-size:12px; color:var(--muted); }
.empty { margin-top:24px; color:var(--muted); }
.back { color:var(--muted); text-decoration:none; font-size:14px; }
.sheet-meta { margin:8px 0 0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.head { margin-top:12px; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.head .bar { height:6px; }
.panes { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; }
.pane .logo, .pane img { width:48px; height:48px; }
.abbr { margin-top:8px; font-size:24px; line-height:1; }
.leaders { margin:8px 0 0; padding:0; list-style:none; }
.leaders li { font-size:12px; color:var(--muted); margin-top:4px; }
.desk { margin-top:16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:12px; }
.desk .tag { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--brass); }
.desk .pts { margin-top:4px; font-size:30px; line-height:1; }
.desk p { margin:8px 0 0; font-size:14px; color:var(--muted); }
.desk a { display:inline-grid; place-items:center; margin-top:12px; min-height:44px; padding:8px 16px; border-radius:999px; background:var(--brass); color:var(--bg); font-weight:650; font-size:14px; text-decoration:none; }
.sec { margin-top:16px; }
.sec h2, .guide h2 { margin:0; font-size:20px; text-transform:uppercase; color:var(--chalk); }
.note { margin:0 0 8px; font-size:14px; color:var(--muted); }
.box { overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.statbtn { width:100%; padding:12px; text-align:left; border-bottom:1px solid var(--line); }
.box .statbtn:last-child { border-bottom:0; }
.statgrid { display:flex; align-items:flex-start; gap:8px; }
.cell { flex:1; min-width:0; }
.cell.right { text-align:right; }
.num { font-size:24px; line-height:1; }
.num.good, .good { color:var(--good); }
.num.bad, .bad { color:var(--bad); }
.cap { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:4px; font-size:12px; color:var(--muted); }
.right .cap { justify-content:flex-end; }
.midname { width:7rem; flex:none; padding-top:4px; text-align:center; font-size:14px; line-height:1.15; text-transform:uppercase; }
.pill { display:inline-flex; min-height:20px; min-width:32px; align-items:center; justify-content:center; border-radius:4px; padding:0 4px; font-size:14px; line-height:1; }
.pill.good { background:var(--good); color:var(--bg); }
.pill.bad { background:var(--bad); color:var(--bg); }
.pill.mid { background:var(--surface-2); color:var(--fg); }
.explain { border-top:1px solid var(--line); padding:12px; font-size:14px; line-height:1.6; }
.explain p { margin:0; }
.explain .gap { margin-top:8px; }
.lineblock { margin-top:16px; overflow:hidden; border-radius:12px; border:1px solid var(--line); background:var(--surface); }
.lineblock h2 { padding:12px 12px 0; }
.lineblock .note { padding:0 12px 12px; border-bottom:1px solid var(--line); }
.lbl { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.val { font-size:24px; line-height:1.15; }
.foot { margin-top:32px; font-size:12px; line-height:1.6; color:var(--muted); }
.guide h2 { position:sticky; top:0; background:var(--bg); padding:8px 0; }
.ghead { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.gname { font-size:20px; line-height:1; text-transform:uppercase; }
.live { font-size:12px; color:var(--chalk); }

right":{"text":"18.6","rank":128,"caption":"HAW scores"}},{"id":"def-ppg","left":{"text":"29.2","rank":107,"caption":"SAC allows"},"right":{"text":"22.5","rank":51,"caption":"HAW allows"}},{"id":"ppg-margin","left":{"text":"-13.1","rank":131,"caption":"SAC"},"right":{"text":"-3.9","rank":103,"caption":"HAW"}},{"id":"turnover-margin","left":{"text":"-6","rank":117,"caption":"SAC season"},"right":{"text":"-1","rank":71,"caption":"HAW season"}},{"id":"giveaways","left":{"text":"1.8","rank":113,"caption":"SAC"},"right":{"text":"1.5","rank":87,"caption":"HAW"}},{"id":"takeaways","left":{"text":"1.3","rank":80,"caption":"SAC"},"right":{"text":"1.5","rank":49,"caption":"HAW"}},{"id":"penalties","left":{"text":"7.3","rank":106,"caption":"SAC"},"right":{"text":"6.9","rank":91,"caption":"HAW"}},{"id":"penalty-ypg","left":{"text":"69.9","rank":123,"caption":"SAC"},"right":{"text":"55.5","rank":75,"caption":"HAW"}},{"id":"fd-by-penalty","left":{"text":"1.5","rank":111,"caption":"SAC","flatRank":true},"right":{"text":"2.8","rank":6,"caption":"HAW","flatRank":true}},{"id":"stuffs","left":{"text":"—","rank":null,"caption":"SAC defense"},"right":{"text":"—","rank":null,"caption":"HAW defense"}},{"id":"field-goal-pct","left":{"text":"75.0%","rank":78,"caption":"SAC"},"right":{"text":"68.2%","rank":104,"caption":"HAW"}},{"id":"net-punt","left":{"text":"42.5","rank":84,"caption":"SAC"},"right":{"text":"42.5","rank":85,"caption":"HAW"}}]}]}},"glossary":[{"id":"market-spread","name":"Market spread","group":"The line","live":true,"gist":"The current point spread, with the price attached.","better":"Neither side is “better.” It is the number the market is hanging.","body":"A spread of Texas -4.5 means Texas has to win by 5 or more to cover. The price next to it (-110, -112) is the juice: how much you lay to win a unit. The sheet you photographed stores both the live number and the number from when that sheet was first built. Those drift. This app shows the current DraftKings number on ESPN’s feed and labels it that way.","mismatch":"If a model spread and the market spread disagree by a couple of points, that is the entire argument. A half-point is noise. Three points is a different game."},{"id":"market-total","name":"Market total","group":"The line","live":true,"gist":"The over/under on combined points.","better":"Not a quality grade. It is the market’s guess at the pace and the finish.","body":"The total is both teams’ points added together. 55.5 means the market expects something in the mid-50s, not a 24–10 rock fight and not a 49–42 shootout. Over and under have their own prices, same idea as the juice on a spread.","mismatch":"A high total with two strong defenses is the market telling you it does not believe the defenses. A low total with two fast offenses is the market betting on field position, weather, or a grind."},{"id":"market-price","name":"Moneyline","group":"The line","live":true,"gist":"The price to win the game straight up, with no points.","better":"A bigger minus number is a stronger favorite. It is a price, not a power rating.","body":"-205 means you lay $205 to win $100. +170 means a $100 bet returns $170 of profit if that side wins. Moneylines and spreads can tell different stories: a small spread with a steep moneyline usually means the market thinks the favorite wins a close one more often than it gets blown out.","mismatch":"Use it as the “who wins” tax. If you like the dog on the spread but the moneyline is short, the market agrees the dog can keep it close and still lose."},{"id":"implied-score","name":"Implied score","group":"The line","live":true,"gist":"The spread and the total, split into two scores.","better":"Not a prediction you grade. It is just the line written as a final.","body":"Favorite score is (total + spread) / 2. Underdog score is (total − spread) / 2. Texas -4.5 with a 55.5 total is Texas 30, Tennessee 25.5. The sheet’s other pair of implied scores comes from its own projected spread and projected total, not from the market. Same math, different inputs. We show the market split, and a second split that uses the FPI margin on that same total.","mismatch":"If your eyes say 34–24 and the line says 27–24, you are arguing about who finishes drives, not about who is more talented."},{"id":"sheet-total","name":"Stats projected total (opponent adjusted)","group":"The line","live":false,"gist":"A model total that re-rates each offense against the defense it actually faces.","better":"Compare it to the market total. The gap is the opinion.","body":"Season points per game lie. A team that hung 50 on two soft defenses has not proved it can hang 50 on a top-10 stop unit. An opponent-adjusted total rebuilds the expected points from the offense-versus-defense matchups (efficiency, explosiveness, finishing) instead of adding two raw scoring averages. On the sheet this is the big number in the header, often a few points off the betting total.","mismatch":"Model 65, market 56 means the sheet thinks both offenses get their chunk plays against these specific defenses. It does not mean you should blindly bet the over. It means go read the explosives and the havoc row."},{"id":"sheet-spread","name":"Projected stats spread (opponent adjusted)","group":"The line","live":false,"gist":"The sheet’s own point spread, built from the matchup stats rather than the betting market.","better":"Read it next to the market spread and next to the power rating.","body":"This is the margin the stat model lands on after it adjusts for opponent. It is not the closing line, and it is not pure talent. A team can be more talented and still be projected to lose because of field position, pace, or a bad trench matchup. The header also shows a separate power-rating spread (a team-strength number, with a price). Those two are allowed to disagree.","mismatch":"Power spread -6 and stat spread -8 means the matchup stats like the favorite a little more than raw team strength does. Look at the middle of the sheet for which unit is causing that."},{"id":"spread-when-created","name":"Spread when created","group":"The line","live":false,"gist":"The line at the moment that sheet was generated, kept so you can see the move.","better":"A move toward a team is information. It is not automatically sharp money.","body":"The sheet freezes the spread and total from when it was built, then keeps showing the current number somewhere else. Texas -5.5 and 57.5 “when created,” then a different number later, is just the market moving. Injury news, a weather update, or ordinary betting can all do that. This app always shows the current posted number, because a frozen open is not in the public feed.","mismatch":"If the number has moved two points toward the dog and the stats have not changed, the market learned something the box score does not show yet."},{"id":"fpi-spread","name":"FPI spread","group":"The line","live":true,"gist":"ESPN’s power gap, turned into a spread.","better":"Closer to team strength than to this week’s matchup stats.","body":"Football Power Index is expected margin against an average opponent on a neutral field. Subtract the two FPIs and you have a neutral spread. We then give the home team 2.5 points, unless the game is at a neutral site, and we say so on the card. A 9.6 FPI gap with the better team on the road becomes about a 7-point road favorite. We also split the market total by that margin so you can see the score shape. That is not the sheet’s opponent-adjusted stat total. It is the power number, written as points.","mismatch":"FPI spread and the betting spread within a point of each other means the market and ESPN’s power model already agree. The interesting sheets are the ones where they do not."},{"id":"win-prob","name":"Win probability","group":"The line","live":true,"gist":"The chance each team wins straight up, taken from the point split so it matches the lean.","better":"Higher is a stronger favorite. It is not a cover probability.","body":"70% means the model has that team winning about 7 games out of 10 if you played it on a loop. It says nothing about laying points. A 70% favorite can still be a bad spread bet if the number is too big. Treat this as “who is live to win,” next to the moneyline, not as a pick.","mismatch":"Win probability and the spread can diverge when the model expects a lot of one-score games, or a lot of blowouts."},{"id":"power-rating","name":"Power rating","group":"Power and résumé","live":true,"gist":"How many points better this team is than an average team.","better":"Higher rating, and a rank closer to 1, is stronger.","body":"On the sheet, power rating is a points number plus a national rank. Texas at 25.95 and rank 1 means “about 26 points better than average, best in the country,” on that model’s scale. The public cousin is ESPN FPI, which is the same kind of number and will not match the sheet’s figure exactly. Ranks are among FBS. Early in the year, talent and returning production still do a lot of the work. By November the results take over.","mismatch":"A big power gap and a small stat-spread gap means the underdog’s matchup profile is better than its reputation."},{"id":"poll-rank","name":"AP / CFP rank","group":"Power and résumé","live":true,"gist":"The poll number people see on the broadcast.","better":"Lower is a higher ranking. Unranked is blank here.","body":"This is the human (or committee) ranking, not a power rating. A team can be 14th in the poll and 10th in FPI, or the other way around, because polls remember brand and results while FPI is a margin model. The sheet shows the rank in the team header. We show ESPN’s AP/CFP figure.","mismatch":"Poll rank is a terrible predictor by itself. Use it to know who the country thinks this is, then read the power and the matchup."},{"id":"strength-of-record","name":"ESPN strength of record","group":"Power and résumé","live":true,"gist":"How hard it would be for a typical top-25 team to have this same record.","better":"Rank 1 is the most impressive résumé. Rank 110 is an empty win total.","body":"Strength of record asks: given this schedule, how often would an average top-25 team have this many wins or more? An undefeated team that beat nobody good can have a worse strength of record than a one-loss team that played a gauntlet. On the sheet this is the bright rank labeled ESPN Strength of Record. It matched ESPN’s accomplishment rank on the sheet you sent. It is a résumé grade, not a “who would win on a neutral field” grade. That second job is the power rating.","mismatch":"Strength of record 1 and a soft remaining schedule is a team protecting a résumé. Strength of record 40 with a top-10 power rating is a good team the poll has not caught up to, or a good team that lost a close one."},{"id":"current-sos","name":"Current strength of schedule","group":"Power and résumé","live":true,"gist":"How hard the games already played have been.","better":"Rank 1 is the hardest slate so far. A high rank (100s) is a soft one. Green here does not mean “better team.”","body":"This is opponent quality to date, from the point of view of a top-25 team. The sheet colors a hard schedule green and a cupcake schedule red, which is easy to misread: red SOS does not mean the defense is bad, it means the wins were cheap. ESPN’s version is the average in-season SOS rank. It moves every week as opponents’ results update.","mismatch":"A top-15 poll team with SOS around 110 has not been examined yet. Discount the scoring averages until the schedule gets real."},{"id":"remaining-sos","name":"Remaining strength of schedule","group":"Power and résumé","live":true,"gist":"How hard the games left are.","better":"Rank 1 is the hardest road ahead. It is a forecast of the résumé, not of this week.","body":"Separate from what a team has already done. Two undefeated teams can have completely different Novembers. ESPN ranks the remaining slate for an average FBS team. Useful when you are deciding whether a record is about to get stress-tested.","mismatch":"Easy wins so far plus a brutal remaining SOS is how a top-10 team becomes a .500 team without “regressing.” The talent was real. The schedule was not."},{"id":"game-control","name":"Game control","group":"Power and résumé","live":true,"gist":"Did this team actually own its games, or did it survive them?","better":"Rank closer to 1 means it controlled games the way a top-25 team should have, given the schedule.","body":"ESPN’s game-control rank looks at in-game win probability across the season, then asks whether an average top-25 team would have bossed these same games. A team that wins 45–42 every week can have a great record and a mediocre game-control rank. A team that leads wire to wire against good opponents will be near the top. The sheet does not always print this row. It is the right question underneath “strength of record.”","mismatch":"Pretty record, ugly game control: the points will regress as soon as an opponent finishes a drive."},{"id":"off-efficiency","name":"Offensive efficiency","group":"Power and résumé","live":true,"gist":"How much of the scoring margin the offense is creating, per play, schedule-adjusted.","better":"Higher on the 0–100 scale, and a rank closer to 1, is a better offense.","body":"ESPN’s offensive efficiency is not yards. It is the offense’s contribution to point margin per play, adjusted for the defenses it has faced. This is the public cousin of offensive PPA and success rate. It will not match those numbers, but it answers the same question: are they actually good at offense once you stop giving them credit for beating bad teams?","mismatch":"Elite offensive efficiency against an elite defensive efficiency is the game. Everything else on the sheet is a detail of that collision."},{"id":"def-efficiency","name":"Defensive efficiency","group":"Power and résumé","live":true,"gist":"How much of the scoring margin the defense is creating, per play, schedule-adjusted.","better":"Higher is a better defense. Rank 1 is the best. Do not invert it.","body":"Same scale as the offense, other side of the ball. Adjusted for the offenses faced, so a defense that stuffed three option teams is not automatically elite. On the sheet, the defensive grades you care about (success rate allowed, PPA allowed, havoc) all live inside a number like this. We show ESPN’s version because the play-by-play versions are not in the public feed.","mismatch":"A top-5 defense against a top-5 offense is not a “pick the defense” rule. Read the down-and-distance rows. Some great defenses still bleed explosives. Some great offenses still die on passing downs."},{"id":"level","name":"Level (P4)","group":"Power and résumé","live":true,"gist":"Power 4 conference, independent, or everyone else.","better":"A label, not a stat. P4 teams are not automatically better on Saturday.","body":"P4 on the sheet means SEC, Big Ten, Big 12, or ACC. It is context for the schedule and the roster, not a quality score. A Group of 5 offense can post video-game yards and still be an average offense once the opponent adjustment hits. We tag P4 and independent teams from ESPN’s conference list and print the conference name either way.","mismatch":"P4 versus a non-P4 team is where raw points per game lie the most. Trust the adjusted efficiencies over the scoreboard."},{"id":"ppa-pass","name":"PPA per pass","group":"Passing","live":false,"gist":"Predicted points added, on pass plays only.","better":"Higher is better for the offense. Lower allowed is better for the defense.","body":"Predicted Points Added starts from expected points: a first-and-10 at the opponent 40 is worth more than a third-and-12 at your own 20. A play’s PPA is how much that expected-points number moved. Average it over dropbacks and you get PPA per pass. It folds in completions, sacks, throwaways, and interceptions, so it is harder to fake than yards per attempt. On the sheet the left number is the offense and the right number is what the opposing defense usually allows.","mismatch":"An offense with a shiny yards-per-attempt and a mediocre PPA is living on a few bombs and giving points back with sacks and picks."},{"id":"yds-attempt","name":"Yards per attempt","group":"Passing","live":true,"gist":"Passing yards divided by pass attempts.","better":"Higher is a more efficient dropback game. Around 7 is ordinary. Over 8.5 is ripping it.","body":"The blunt passing-efficiency number. It includes sacks only if the feed is using net yards per attempt; the figure on this app is ESPN’s yards per pass attempt. It does not know down and distance. A 4-yard completion on 3rd-and-3 is a win that looks bad here, and a 40-yard completion on 1st-and-30 can be empty. That is why the sheet pairs it with success rate and PPA. We show the season rate for both offenses. Yards per attempt allowed is not a clean number in the public team feed, so it stays off the live card.","mismatch":"High yards per attempt and a low success rate is a boom-or-bust passer. Fun, and fragile, against a defense that does not give up the explosive."},{"id":"qbr","name":"QBR / passer rating","group":"Passing","live":true,"gist":"A single quarterback grade. The sheet’s scale is not ESPN’s 0–100 QBR.","better":"Higher is better for the offense. On the passer-rating scale, 140-plus is good and 160-plus is cooking. Opponent rating allowed should be lower.","body":"The row labeled QBR on that sheet often prints numbers like 155 or 111. That is the old passer-rating family (it runs past 100, sometimes past 180), sometimes opponent-adjusted. It is not ESPN Total QBR, which is capped at 100. Passer rating rewards completion percentage, yards per attempt, touchdown rate, and not throwing picks. It ignores sacks and rushing. We show team passer rating from the season stat line and we call it passer rating so the scale is honest.","mismatch":"A big passer rating against a defense that allows a big passer rating is the air-raid version of the game. Check interceptions per pass before you trust it. One pick-six changes the math more than 30 yards does."},{"id":"pass-rate","name":"Pass rate","group":"Passing","live":true,"gist":"What share of plays are passes.","better":"This is an identity, not a grade. Do not treat a red rank as “bad.”","body":"Pass attempts divided by pass attempts plus rushes. A 36% pass rate is a run-first team. A 55% pass rate is a dropback team. The sheet still colors the national rank, which makes a run-heavy offense look “bad” at passing volume. That is a style flag. Use it to know which rows matter: a run-first offense lives and dies on rush success, stuff rate, and line yards, not on raw pass volume.","mismatch":"A low pass-rate offense against a defense that is only good against the pass is a problem for the defense, not the offense."},{"id":"pass-success","name":"Pass success rate","group":"Passing","live":false,"gist":"How often a pass actually stays on schedule.","better":"Higher is better for the offense. Lower allowed is better for the defense. Low-40s is a healthy college passing success rate. High-30s is ordinary.","body":"A play is a success at 50% of the needed yards on first down, 70% on second, and 100% on third or fourth. Pass success rate is that rule, passes only. It ignores how pretty the completion was. An 8-yard gain on 3rd-and-15 is a failure. A 5-yard gain on 3rd-and-4 is a success. This is the chain-moving half of the passing game. Explosiveness is the chunk-play half. You want both, and you should panic if you only have one.","mismatch":"Pass success in the 40s against a defense that allows pass success in the 30s is a real edge, even if the talent ranks look even."},{"id":"pass-explosiveness","name":"Pass explosiveness","group":"Passing","live":false,"gist":"How big the successful passes are. Chunk plays, not consistency.","better":"Higher is more explosive for the offense. Lower allowed is better for the defense.","body":"Explosiveness is the average value of the successful plays only, usually in predicted points. It throws out the boring 4-yard gains and asks what happens when the play works. A team can be very explosive and still be a bad offense if it only works twice a game. Pair it with success rate. Success is frequency. Explosiveness is magnitude.","mismatch":"An explosive passing game against a defense that does not allow explosives is how favorites go to overtime instead of winning by 17."},{"id":"havoc","name":"Havoc rate","group":"Passing","live":false,"gist":"How often the defense wrecks the play behind the line or in the route.","better":"Lower havoc allowed is better for the offense. Higher havoc created is better for the defense.","body":"Havoc is the disruptive plays: tackles for loss, forced fumbles, and passes deflected or intercepted, divided by snaps. The sheet’s “havoc rate allowed” on the offense side is how often the offense lets that happen. The defense side is how often that defense creates it. A defense living around 20% is in the backfield a lot. An offense allowing 11% is protecting well. The live sheet shows the box-score cousins: sacks taken versus sacks made. That is only the sack slice of havoc, not the whole thing.","mismatch":"A clean offensive line (low havoc allowed, low stuff rate) against a havoc defense is the first place a ranked favorite gets upset. Pressures become empty possessions before the skill players matter."},{"id":"sacks","name":"Sacks","group":"Passing","live":true,"gist":"Sacks taken by the offense versus sacks made by the defense, per game.","better":"Fewer sacks taken is better. More sacks made is better. They are not the same stat, which is why the captions differ.","body":"A sack is a havoc play you can count without charting every snap. Per game keeps a team that has played three games comparable to one that has played four. It still is not opponent-adjusted: sacking a true freshman in a 40-point game is easier than sacking a veteran who gets the ball out. Read it next to pass rate. A run-heavy team can have a pretty sack number because it rarely drops back.","mismatch":"Three sacks a game allowed, against a defense that creates three sacks a game, is a long afternoon for the quarterback even if the season passer rating looks shiny."},{"id":"pass-downs-ppa","name":"Passing-downs PPA","group":"Passing","live":false,"gist":"Predicted points added when the offense is behind the chains.","better":"Higher (less negative) is better for the offense. Allowing less is better for the defense.","body":"Passing downs are the ugly ones: 2nd and 8 or more, and 3rd or 4th and 5 or more. Everybody knows a pass is coming, so PPA usually goes negative. The teams that stay near zero here are the ones with a real dropback answer. Defenses that push this number deep negative are the ones that end drives instead of bending.","mismatch":"An offense that is fine on standard downs and dead on passing downs will lose to any defense that can force a second-and-long. Check stuff rate. That is how you get into passing downs."},{"id":"pass-downs-rate","name":"Passing-downs rate","group":"Passing","live":false,"gist":"How often the offense is behind schedule.","better":"Lower is better for the offense. It means they are staying ahead of the sticks.","body":"This is not “how often they pass.” It is how often the situation is a passing down. A team at 30% is living on schedule. A team at 40% is playing uphill all day. It is mostly a rushing and first-down story that shows up in the passing section because that is when the quarterback inherits the mess.","mismatch":"A defense that does not have to be good at rushing the passer can still win if it forces passing downs. Then the pass rush only has to win the plays that are already hard."},{"id":"pass-downs-success","name":"Passing-downs success","group":"Passing","live":false,"gist":"Success rate once the offense is already behind the chains.","better":"Higher is better for the offense. Lower allowed is better for the defense.","body":"Same success rule as everywhere else, only on passing downs. League-average here is ugly on purpose. A team converting these at a high rate has a quarterback and receiver combination that can win against a crowded box and a known pass. It is the best “can they get out of trouble” number on the sheet.","mismatch":"If both the rate of passing downs and the success rate on them are bad, the offense is one stuff away from a punt every series."},{"id":"ints-per-pass","name":"Interceptions per pass","group":"Passing","live":true,"gist":"How often a dropback becomes a turnover.","better":"Lower is better for the offense. Something near 2% is tidy. Over 3% is a problem.","body":"Interceptions divided by pass attempts. It is small, and it swings games anyway, because an interception is a possession plus field position. The sheet prints it as a rate so a team that throws 40 times is not punished relative to a team that throws 20, the way a raw pick total would. We show the season rate for each offense. Defensive interceptions per game sit with takeaways.","mismatch":"A careful offense (low INT rate) against a ball-hawking defense is usually fine. A loose offense against that same defense is how a 7-point favorite becomes a 10-point loss."},{"id":"ppa-rush","name":"PPA per rush","group":"Rushing","live":false,"gist":"Predicted points added on runs.","better":"Higher is better for the offense. Lower allowed is better for the defense.","body":"Same predicted-points idea as the pass version, runs only. It respects that a 3-yard gain on 3rd-and-2 is worth more than a 3-yard gain on 2nd-and-11. Yards per rush cannot see that. PPA can. Negative PPA per rush means the run game is making the next play harder.","mismatch":"Positive rush PPA against a defense that allows negative rush PPA is a “they will not need to throw” game, unless the offense shoots itself with penalties."},{"id":"yds-rush","name":"Yards per rush","group":"Rushing","live":true,"gist":"Rushing yards divided by carries.","better":"Higher is better. A hair over 4 is ordinary in this era. Over 5.5 is a real run game.","body":"Easy to read, easy to fool. One 60-yard run can drag a bad ground game up to 5.0 a carry. That is why the sheet also carries success rate, stuff rate, and line yards. We show the season yards per rush for each offense. Yards per rush allowed is rolled into the rushing-yards-allowed row on the matchup, because the public feed does not publish a clean per-carry defensive rate.","mismatch":"Yards per rush can look fine while stuff rate is awful. The long run is hiding the tackles for loss. Read both."},{"id":"rush-rate","name":"Rush rate","group":"Rushing","live":true,"gist":"What share of plays are runs. The mirror of pass rate.","better":"Identity, not a grade.","body":"Rush attempts divided by rushes plus passes. If pass rate is 36%, rush rate is 64%. Same warning as pass rate: the color on a national rank is about volume, not quality. Use it to weight the rushing rows. A 60% run team that is bad at rushing is in real trouble. A 40% run team that is bad at rushing can still be an offense.","mismatch":"Run rate tells you what the defense has to take away. It does not tell you whether the offense can do the other thing when you take it away."},{"id":"rush-success","name":"Rush success rate","group":"Rushing","live":false,"gist":"How often a run stays on schedule.","better":"Higher is better for the offense. Over 50% on runs is strong because the bar on first down is only half the yards. Lower allowed is better for the defense.","body":"Same 50 / 70 / 100 success rule, runs only. This is the “are we ahead of the sticks” number. A team can average 5.5 yards a carry on explosives and still have a bad rush success rate if every other carry is 1 yard. That team is one missed block from a passing down. The sheet splits offensive success rate into pass and rush for this reason.","mismatch":"Rush success in the 50s against a defense that allows rush success in the high 30s is a body blow. The offense will live on standard downs, which is where favorites pull away."},{"id":"rush-explosiveness","name":"Rush explosiveness","group":"Rushing","live":false,"gist":"How big the successful runs are.","better":"Higher is more explosive. Lower allowed is a defense that tackles and keeps the second level clean.","body":"Average value of successful runs only. This is the home-run rate of the ground game: the runs that turn a 5-yard gain into 25 because a linebacker missed a fit. It is not line play. Line yards measure the first level. Explosiveness often measures the back and the second and third levels.","mismatch":"A defense can stuff the line (good stuff rate, good line yards allowed) and still bleed explosives if the safeties take bad angles. That shows up here and not in the trench rows."},{"id":"ol-yards","name":"Line yards","group":"Rushing","live":false,"gist":"Rushing yards credited to the offensive line, with long runs capped.","better":"Higher is better for the offense, typically on a per-carry scale around 2.5 to 3.5. Lower allowed is better for the defensive front. The sheet’s 3.9 is a top-tier line.","body":"Line yards try to stop a 70-yard touchdown from making the left tackle look like the best player on the field. Yards are credited heavily up to a few yards past the line, then discounted, and stuffed runs hurt. What is left is mostly blocking and the first hit. “OL yds” on the sheet is this idea. The right-hand number is what the defensive line usually allows.","mismatch":"A top-10 line-yards offense against a top-5 line-yards defense is the actual game in the trenches, more than the recruiting rank of the left tackle."},{"id":"stuff-rate","name":"Stuff rate","group":"Rushing","live":false,"gist":"Runs stopped at or behind the line of scrimmage.","better":"Lower is better for the offense. Under 15% is clean. Higher is better for the defense. Over 22% is a front that lives in the backfield.","body":"Stuffs divided by rushes. A stuff is a zero or negative run. It is the single most violent rushing stat because it does not just fail, it moves the offense backward into a passing down. The live sheet shows stuffs per game as a cousin, not this rate, because opponent rush attempts are not in the public team feed. Do not treat a raw stuffs total as the rate.","mismatch":"High stuff rate on defense against a high rush-rate offense is the cleanest upset path on the sheet. You do not need to cover receivers if the offense is never on schedule."},{"id":"stuffs","name":"Stuffs per game","group":"Rushing","live":true,"gist":"How many runs a defense stops at or behind the line, per game.","better":"More is better for the defense. It is a count, not the rate.","body":"This is the box-score piece of stuff rate. Without the opponent’s rush attempts, a team that faces 50 runs and a team that faces 30 runs are not comparable, so we do not pretend this is the sheet’s stuff rate. It is still worth seeing next to sacks: some fronts wreck runs and never touch the quarterback, and some do the opposite.","mismatch":"A lot of stuffs plus a lot of sacks is a havoc front. A lot of stuffs and no sacks is a run-only problem for the offense, which a good quarterback can avoid by throwing early."},{"id":"standard-downs-ppa","name":"Standard-downs PPA","group":"Rushing","live":false,"gist":"Predicted points added when the offense is on schedule.","better":"Higher is better for the offense. These are the downs you are supposed to win.","body":"Standard downs are 1st down, 2nd and 7 or fewer, and 3rd or 4th and 4 or fewer. The offense gets to choose run or pass. PPA here is the “we are fine, now go be good” number. Great offenses separate on standard downs. Average offenses only look fine because passing-downs samples are small.","mismatch":"If the favorite is not winning standard downs against this defense, the talent gap is not showing up where it is supposed to."},{"id":"standard-downs-rate","name":"Standard-downs rate","group":"Rushing","live":false,"gist":"How often the offense is on schedule. The mirror of passing-downs rate.","better":"Higher is better. It means fewer plays are emergencies.","body":"If 65% of your snaps are standard downs, you are playing the game you want. This is mostly the residue of rush success, stuffs avoided, and not shooting yourself with penalties. It is a result, not a play call.","mismatch":"A defense’s job in the first half is often just to drag this number down. If it cannot, the offense will keep the play sheet open and the game gets away."},{"id":"standard-downs-success","name":"Standard-downs success","group":"Rushing","live":false,"gist":"Success rate when the offense gets to choose.","better":"Higher is better for the offense. This should be the prettier of the two success rates.","body":"Same success rule, only on standard downs. A drop from standard-down success to passing-down success tells you how much of the offense is “real” and how much is “we stay out of trouble.” Teams that are only good on standard downs can still win if they avoid passing downs. Teams that cannot win standard downs have nothing to fall back on.","mismatch":"Standard-down success is where you check a “they’re just more physical” claim. If it is even, they are not."},{"id":"fumbles-lost-per-rush","name":"Fumbles lost per rush","group":"Rushing","live":true,"gist":"Lost fumbles divided by carries.","better":"Lower is better. The base rate is tiny, so a few fumbles swing the rank fast.","body":"The sheet uses a rate so a 50-carry team is not automatically “fumbly” compared with a 25-carry team. Early in a season the rank is noisy: one lost fumble in 40 carries is a story, not a trait. Still, a team that is already at two or three lost fumbles in three games is handing away the field-position battle the power rating thinks it should win.","mismatch":"Fumble luck is the classic way a good team loses to a worse one by a field goal. Do not build a season-long take on three games of it. Do notice it this week if the ball security is already ugly."},{"id":"avg-field-position","name":"Average field position","group":"Downs and finishing","live":false,"gist":"Where drives start.","better":"Further up the field is better for the offense. A couple of yards per drive is a real point.","body":"Touchbacks, punt units, and takeaways all show up here before the offense takes a snap. Average starting field position in the high 20s (own 28, own 29) is normal in the touchback era. Starting at the own 35 all day is a hidden touchdown across a game. The sheet’s figure is their yard-line or index version of this. The public team feed does not publish a clean starting-field-position number, so we explain it instead of printing a guess. Special teams efficiency is the live cousin.","mismatch":"An offense with a great success rate that starts at its own 20 every drive will still punt. Field position can make a good offense look stalled."},{"id":"scoring-opps","name":"Scoring opportunities per game","group":"Downs and finishing","live":false,"gist":"How often a drive becomes a real chance to score.","better":"More is better for the offense. Fewer allowed is better for the defense.","body":"Bill Connelly’s version is a trip inside the opponent’s 40, not just the red zone. Five a game is ordinary. Seven is an offense that is getting there. Points per opportunity then tells you if they finish. A team can be elite at creating chances and ordinary at cashing them, which looks like a kicker problem, a red-zone play-calling problem, or a goal-line size problem.","mismatch":"Lots of opportunities against a defense that rarely allows them is a hidden yards edge. The scoreboard has not happened yet, but the drives are tilted."},{"id":"pts-per-scoring-opp","name":"Points per scoring opportunity","group":"Downs and finishing","live":false,"gist":"What they do once they get into scoring range.","better":"Higher is better for the offense. Around 4 is fine. Near 5 means they are turning chances into touchdowns. Lower allowed is better for the defense.","body":"Points scored divided by scoring opportunities. This separates “we move the ball” from “we score.” A defense that bends into the 40 and then forces field goals will look bad in yards and fine in points per opportunity allowed. That defense is doing its job. The offense on the other side is the one with the problem if its own points-per-opportunity is stuck near 3.","mismatch":"This is the finishing argument. Efficiency gets you there. This number is whether the trip was worth it."},{"id":"third-down-pct","name":"Third-down conversion","group":"Downs and finishing","live":true,"gist":"Third downs converted, divided by third downs faced.","better":"Higher is better for the offense. Mid-30s is ordinary. Over 45% is a real chain-moving offense.","body":"The broadcast version of success rate. It is narrower: only third downs, and it treats a 3rd-and-1 the same as a 3rd-and-15 in the denominator. That is why a team can be a poor success-rate offense and still post a pretty third-down percentage, or the reverse, depending on how many third-and-shorts it earns. We show the season percentage. Opponent third-down percentage allowed is not reliable in the public team feed this year, so both columns are the offense’s own rate.","mismatch":"Third down is a result of first and second down. If stuff rate is bad, this number will follow. Do not treat a hot third-down percentage on a soft schedule as a trait yet."},{"id":"third-down-att","name":"Third downs per game","group":"Downs and finishing","live":true,"gist":"How often a drive reaches a third down.","better":"Fewer can mean the offense is converting earlier. It can also mean the drive already died. Read it with the conversion rate.","body":"A count of third-down tries per game. An efficient offense that converts on first and second down will face fewer third downs and should convert the ones it does face at a higher rate, because they are shorter. An offense that faces 15 third downs a game is living in trouble. The sheet prints attempts per game next to the percentage so you can see the sample.","mismatch":"A lot of third downs at a low conversion rate is a punt team. The power rating may still like them. The drives will not cooperate."},{"id":"fourth-down-pct","name":"Fourth-down conversion","group":"Downs and finishing","live":true,"gist":"Fourth downs converted, divided by attempts.","better":"Higher is better, but the sample is tiny. Do not worship a 3-for-4.","body":"Most teams only try a handful of fourth downs, so the percentage swings wildly in September. The rate matters less than the willingness (attempts per game) plus whether they are trying manageable ones. A team that is 4-for-7 from the opponent 40 is aggressive and fine. A team that is 1-for-6 from its own 35 is just losing the field-position battle twice.","mismatch":"Early-season fourth-down rate is a vibe, not a weapon, until the sample gets out of the single digits."},{"id":"fourth-down-att","name":"Fourth downs per game","group":"Downs and finishing","live":true,"gist":"How often they go for it.","better":"More means more aggressive. It is a choice, not a skill grade.","body":"The sheet lists attempts per game so you know if the conversion rate is built on one trick play. Aggressive teams change the total and the spread math: they score touchdowns where other teams kick, and they also turn the ball over on downs where other teams punt. Both show up in points, not in yards.","mismatch":"A very aggressive fourth-down team against a defense that is good on standard downs will either look brilliant or hand the opponent short fields. There is not a quiet version of that game."},{"id":"off-td-per-game","name":"Offensive touchdowns per game","group":"Downs and finishing","live":true,"gist":"Touchdowns the offense is scoring per game.","better":"More is better. It is a finishing count, not an efficiency stat.","body":"Raw touchdowns per game, from the scoring line. It includes rushing and passing scores and ignores whether the schedule was soft. A team scoring seven touchdowns a game against non-conference opponents has not proved a red-zone profile. Use it as the loud version of “are the drives ending in points,” then trust opponent-adjusted efficiency when the two disagree.","mismatch":"Touchdowns per game can be high while points per opportunity are ordinary, if the team simply creates more chances. That is a volume story. Volume drops when the opponent tackles."},{"id":"off-ppg","name":"Points per game","group":"Downs and finishing","live":true,"gist":"Season scoring average, and on the matchup card, points allowed by the other side.","better":"More scored is better. Fewer allowed is better. The captions tell you which column is which.","body":"The sheet’s side rail splits this into offense PPG and defense PPG, then shows the margin. On the matchup block we put one team’s points scored next to the opponent’s points allowed, which is the actual collision. Neither number is opponent-adjusted. A 47-point offense that has not played a Power 4 defense is not a 47-point offense yet. The adjusted cousin is offensive and defensive efficiency in the power block.","mismatch":"When points scored and points allowed disagree with the efficiencies, believe the efficiencies for “who is good” and believe the points for “what has actually happened.”"},{"id":"off-ypg","name":"Yards per game","group":"Downs and finishing","live":true,"gist":"Total offense yards per game versus yards the other defense allows.","better":"More yards on offense, fewer allowed on defense. Yards are not points.","body":"The oldest matchup row in football. It is also one of the easiest to misuse, because pace and garbage time inflate it, and because a team can gain 450 yards and kick four field goals. We still show it, offense versus the yards the other team allows, because that is the spine of the photographed sheet: your production against what they usually give up. Passing yards and rushing yards are the split.","mismatch":"A big yards edge with a tiny points edge means somebody is not finishing. Go to third down, red zone, and turnovers."},{"id":"off-pass-ypg","name":"Passing yards per game","group":"Passing","live":true,"gist":"Passing yards per game versus passing yards the defense allows.","better":"Context first. Volume follows pass rate. Efficiency is yards per attempt.","body":"A run-first team will “lose” this row every week and it will not matter. Read it only after pass rate. If both teams throw a lot, then yards per game versus yards allowed is a fair volume check, and yards per attempt is the quality check. The allowed number is what that defense has given up per game, not per attempt.","mismatch":"Huge passing-yards allowed on a defense, against an offense that wants to throw, is the shootout path. Check havoc and interceptions before you assume the yards will be clean."},{"id":"off-rush-ypg","name":"Rushing yards per game","group":"Rushing","live":true,"gist":"Rushing yards per game versus rushing yards the defense allows.","better":"More on offense, fewer allowed. Again, volume follows how often they run.","body":"Same warning as the pass version. A team that runs 50 times will pile up yards even at 4.0 a carry. Yards per rush is the rate. This row is the volume against what the defense has been giving up on the ground. Useful when both sides are honest about wanting to run.","mismatch":"If the offense’s rushing yards per game are ordinary and the defense’s rushing yards allowed are tiny, the offense probably cannot run its usual game. Then the pass rows become the whole story."},{"id":"ppa-margin","name":"PPA margin","group":"The side rails","live":false,"gist":"Offensive predicted points minus what the defense allows.","better":"Higher is a better team. This is the single best side-rail summary.","body":"PPA margin is the offense’s predicted points added per play minus the defense’s predicted points added allowed per play. Positive means the team creates more value on offense than it gives up on defense. The sheet then opens the hood: offense per drive, defense per drive, offense per play, defense per play. Per-drive numbers fold in finishing and turnovers that end series. Per-play numbers are the efficiency. A team can have a great per-play offense and a bad per-drive number if it turns the ball over or stalls in the red zone.","mismatch":"When PPA margin and the power rating disagree, PPA is telling you the plays look different from the team’s reputation. Early in the year, trust power a bit more. By midseason, trust the margin."},{"id":"off-success","name":"Offensive success rate","group":"The side rails","live":false,"gist":"How often any play stays on schedule. The consistency grade.","better":"Higher is better. High 40s is a good college offense. The pass and rush splits sit underneath it.","body":"Success rate uses the 50 / 70 / 100 rule on every play. It is the “are we boring and effective” number. The sheet prints the overall rate and then pass and rush, because a 48% offense can be a 52% run team and a 38% pass team. That is a different game plan from an even split. National rank is among FBS offenses.","mismatch":"Success rate is the floor. Explosiveness is the ceiling. A high floor against a defense that allows a high success rate is how 14-point favorites cover without any highlight."},{"id":"def-success","name":"Defensive success rate","group":"The side rails","live":false,"gist":"How often the defense lets a play be a success.","better":"Lower allowed is better. The rank already runs that direction: rank 1 allows the least success.","body":"Same rule, from the defense’s side. A defense allowing success in the mid-30s is winning a lot of snaps. One allowing it over 45% is getting moved on schedule all night. The pass and rush splits matter: a defense can be stout against the run (low rush success allowed) and soft against the pass. The overall number hides that. The sheet does not.","mismatch":"If offensive success and defensive success allowed are both elite, the game is about explosives and field position, not about “who is more physical.” Both are physical."},{"id":"available-yds","name":"Available yards","group":"The side rails","live":false,"gist":"The percent of the yards that were available to the end zone that the offense actually took.","better":"Higher is better for the offense. The margin is offense minus what the defense allows.","body":"Every play has a maximum: the yards left to the goal line. A 10-yard gain from your own 20 uses 10 of 80 available yards. A 10-yard gain from the opponent 15 uses 10 of 15. Available-yards percentage averages that. It punishes empty yards in your own end and credits real progress toward scoring. The margin on the sheet is the team’s offensive available-yards rate minus the rate it allows on defense. The sub-rows are offense and defense separately.","mismatch":"Two teams with the same yards per play can have very different available-yards numbers if one of them does its work near the goal line and the other does it between the 20s."},{"id":"plays-off","name":"Offensive plays per game","group":"The side rails","live":true,"gist":"How many snaps the offense gets.","better":"More snaps is more chances. It is not efficiency.","body":"The sheet’s plays-per-game row is often both sides combined, with offense and defense split underneath, plus a pace per minute. We show offensive plays per game from the season snap count. A team with 75 plays a game is either fast or lucky with turnovers and short fields. A team with 58 is either grinding long drives or getting off the field too fast because it punts. Pace, next to this, tells you which.","mismatch":"An efficient offense that only gets 55 plays will lose a track meet to a slightly worse offense that gets 75. Totals care about this more than spreads do."},{"id":"pace","name":"Pace","group":"The side rails","live":true,"gist":"How fast the offense snaps, once it has the ball.","better":"Higher is faster. Around 2 to 2.5 plays per minute of possession is a normal college tempo. This is not “better,” it is the tempo.","body":"The sheet’s pace is plays per minute. Ours is offensive plays divided by minutes of possession, so a team is not credited for tempo just because the opponent punts a lot. Labeled that way on the card. Fast tempo raises the total and shortens the game for a defense that wants to get off the field. Slow tempo lets a defense rest and lets a favorite choke the clock if it can stay on schedule.","mismatch":"Two fast teams push the total up even if neither is efficient. Two slow teams plus two good defenses is how a 48 total dies at 34."},{"id":"pts-per-play-off","name":"Points per play","group":"The side rails","live":true,"gist":"Points divided by offensive plays.","better":"Higher is better. It is the blunt efficiency number you can compute from a box score.","body":"The sheet’s points-per-play margin is offensive points per play minus defensive points per play allowed, with both sides shown. We can show the offensive half from the public feed: total points divided by offensive plays. We cannot honestly show points allowed per defensive play, because defensive snap counts are not clean in that feed. So the live row is the offense only. The margin version on the sheet is the one that includes the defense.","mismatch":"Points per play will track scoring average unless pace is weird. If points per play is elite and points per game are ordinary, the team is efficient and slow. That covers spreads more often than it hits overs."},{"id":"ppg-margin","name":"Points per game margin","group":"The side rails","live":true,"gist":"Points scored per game minus points allowed per game.","better":"Higher is better. It is the scoreboard version of team quality, with no opponent adjustment.","body":"The sheet prints the margin and then offense PPG and defense PPG underneath. A +33 margin is a team winning big, not necessarily a team that will win big against the next opponent. Still the right first check: if the margin is negative, every advanced excuse has to climb out of an actual hole. We compute it from points per game and points allowed per game.","mismatch":"A huge margin built on a soft SOS should shrink. Strength of schedule is the correction. If SOS is also hard and the margin is huge, that is just a good football team."},{"id":"def-ppg","name":"Points allowed per game","group":"The side rails","live":true,"gist":"What the defense is giving up.","better":"Lower is better.","body":"Defense PPG on the sheet. Not opponent-adjusted, so a defense that has faced two option teams and a backup quarterback will look like a shutdown unit. Pair it with defensive efficiency and with strength of schedule before you decide the unit is real. On the matchup block, this number is what gets set against the opponent’s points scored.","mismatch":"Points allowed in the teens, against an offense averaging 40, is the “something has to give” row. Check who they each played."},{"id":"net-pts-drive","name":"Net points per drive","group":"The side rails","live":false,"gist":"Points per offensive drive minus points allowed per defensive drive.","better":"Higher is better. It is cleaner than points per game because it does not care how many drives pace created.","body":"The sheet shows the net, then opens it: offensive drives per game, defensive drives per game, offensive points per drive, defensive points per drive. Points per drive is the best simple “did the possession end in points” stat. Drives per game is mostly pace and turnovers. A team can score a lot of points per game just by getting more drives. Net points per drive refuses to give them that credit. The public feed’s drive count is not populated reliably this season, so we do not print a homemade version.","mismatch":"If points per game look great and points per drive look ordinary, the team is winning the possession count. That edge disappears against an offense that does not punt."},{"id":"explosiveness-net","name":"Explosiveness","group":"The side rails","live":false,"gist":"Chunk-play value on offense, on defense, and the net.","better":"Higher offensive explosiveness is better. Lower defensive explosiveness allowed is better. Net is offense minus defense.","body":"The side rail rolls the pass and rush explosiveness idea into one team number, then splits offense and defense. Net explosiveness tells you who is winning the highlight plays. A team can have a negative PPA margin and a positive explosiveness margin: they are losing the boring snaps and winning the long ones. Those teams cover when the long one hits and get crushed when a defense takes it away.","mismatch":"Bet the explosives against a defense that tackles. Do not bet them against a defense whose whole identity is “no explosives, bend everywhere else.”"},{"id":"turnover-margin","name":"Turnover margin","group":"Penalties, takeaways, red zone","live":true,"gist":"Takeaways minus giveaways.","better":"Positive is better. Per game is the fair way to read it. The season total is what ESPN ranks.","body":"The sheet shows margin and then giveaways per game and takeaways per game. Margin is the noisiest “skill” in football over a month and one of the most real over a season. A team at zero through three games has not proven it is careful or careless yet. We show the season margin and the per-game giveaway and takeaway rates so a couple of fumbles do not look like a philosophy. Not opponent-adjusted.","mismatch":"A big underdog with a clearly better turnover profile can win without “playing better.” One extra possession is worth about a field goal to a touchdown, before you even count the short field."},{"id":"giveaways","name":"Giveaways per game","group":"Penalties, takeaways, red zone","live":true,"gist":"Interceptions and lost fumbles, per game.","better":"Lower is better.","body":"The offense’s mess, stated as a rate. Around one a game is normal. Two a game is a self-inflicted underdog. The sheet splits this out under turnover margin so you can see whether the margin is “we take the ball away” or “we do not give it away.” Those are different traits. Takeaways regress faster than giveaways, because takeaways depend on the other quarterback.","mismatch":"On the matchup block, giveaways per game are set next to the opponent’s takeaways per game. If both numbers are high, somebody is leaving with the ball on the ground."},{"id":"takeaways","name":"Takeaways per game","group":"Penalties, takeaways, red zone","live":true,"gist":"Interceptions and recovered fumbles, per game.","better":"Higher is better, and it is the flaky half of turnover margin.","body":"Defenses that hawk the ball are real, and September samples are not. Two interceptions in a 40-point win against a backup can lead the national rank. Read the rate, then look at who they played. Havoc rate is the more stable cousin: pressure and passes defensed create takeaways, but the takeaway itself is the coin flip on top.","mismatch":"Do not lay a big number just because a defense is plus-two in turnovers after three games. Do pay attention if the same team is also creating havoc and sacks. That is the mechanism, not the luck."},{"id":"ball-security","name":"Giveaways against takeaways","group":"Penalties, takeaways, red zone","live":true,"gist":"This offense’s giveaways per game versus this defense’s takeaways per game.","better":"You want your giveaway rate lower than their takeaway rate.","body":"This is the matchup version of the two side-rail rows. It is not a single national stat. It asks a simpler question: does this offense cough it up more often than this defense usually takes it? If the offense gives it away 0.7 times a game and the defense takes it 2 times a game, the defense’s season says it will be hunting. Small samples. Still the right comparison.","mismatch":"When both the giveaway rate and the opposing takeaway rate are low, turnovers are probably not how this game breaks. Look at the trenches instead."},{"id":"penalties","name":"Penalties per game","group":"Penalties, takeaways, red zone","live":true,"gist":"How often the team beats itself with flags.","better":"Fewer is better. Eight a game is a lot. Four is clean.","body":"The sheet shows your penalties and the opponent’s penalties as separate rows, because drawing flags is a skill (or a style) and committing them is a different one. A disciplined offense that also draws a lot of flags is stealing hidden yards. A team at eight penalties a game is donating first downs. We show the team’s own penalties per game. Opponent penalties are explained below and are not a clean live feed.","mismatch":"Penalty yards are hidden field position. A team that is even in yards per play and losing the penalty battle is not actually even."},{"id":"penalty-ypg","name":"Penalty yards per game","group":"Penalties, takeaways, red zone","live":true,"gist":"How many yards the flags cost.","better":"Fewer is better. A few 15-yarders hurt more than a pile of 5-yard illegal shifts.","body":"Count and yards tell different stories. Six false starts is annoying. Three personal fouls is a drive. The sheet prints both, plus opponent penalty yards, so you can see the hidden-yard swing. We show this team’s penalty yards per game.","mismatch":"If one side is giving up 70 penalty yards a game and the other is not, that is a touchdown of field position across the afternoon, before anyone runs a play."},{"id":"opp-penalties","name":"Opponent penalties","group":"Penalties, takeaways, red zone","live":false,"gist":"How many flags the other team commits against you.","better":"More opponent penalties is better. It is partly style (you play in a way that draws them) and partly luck.","body":"The sheet tracks opponent penalties per game, opponent penalty yards, first downs by penalty, and opponent first downs by penalty. First downs by penalty are the expensive ones: the flag did not just move the ball, it reset the downs. A defense that jumps offside on third-and-3 is donating a series. We do not have a reliable opponent-penalty line in the public team feed, so this stays a reading note.","mismatch":"A very physical defense against an offensive line that already jumps a lot is where pre-snap flags pile up. That shows up here, not in PPA."},{"id":"fd-by-penalty","name":"First downs by penalty","group":"Penalties, takeaways, red zone","live":true,"gist":"How often a flag hands this offense a fresh set of downs, per game.","better":"More means the opponent is bailing you out. It is not an offensive skill you should count on.","body":"The sheet splits first downs by penalty and opponent first downs by penalty. We show how many per game this team’s offense is gaining via flag. If a chunk of their “success” is third-and-long defensive holding, the success rate is softer than it looks. Small sample, same as everything in September.","mismatch":"An offense that needs flags to stay on schedule will look ordinary the week the opponent is disciplined."},{"id":"off-rz","name":"Offensive red-zone conversion","group":"Penalties, takeaways, red zone","live":false,"gist":"Trips inside the 20 that turn into any score.","better":"Higher is better. 100% means they at least kicked it every time. The touchdown rate underneath is the one that covers spreads.","body":"The sheet shows the scoring conversion, then red-zone attempts per game (how often they get there) and red-zone touchdown rate (how often it is six instead of three). A team can be perfect on conversion and still be a field-goal team. That team loses to a defense that forces threes and scores sixes. ESPN’s red-zone fields are not populated in the team feed this season, so we are not printing a fake zero.","mismatch":"Red-zone touchdown rate is the last five yards of the entire sheet. Offensive and defensive lines, not the deep ball."},{"id":"def-rz","name":"Defensive red-zone conversion","group":"Penalties, takeaways, red zone","live":false,"gist":"How often opponents score once they reach your 20, and how often it is a touchdown.","better":"Lower scoring conversion is better. Lower touchdown rate is even more important. A defense can allow scores and still win the red zone if it is all field goals.","body":"Same three numbers as the offense, from the other side: conversion allowed, trips per game, touchdown rate allowed. A defense with an 85% score rate allowed and a 29% touchdown rate allowed is bending and then finding a stop. That is a good red-zone defense wearing a mediocre conversion rank. Read the touchdown rate before you insult it. The sheet’s rank on the conversion can look “bad” while the touchdown rank is excellent.","mismatch":"This is how unders hit in games that “felt like” the favorite moved the ball. They did. They kicked."},{"id":"st-efficiency","name":"Special teams efficiency","group":"Talent, halves, special teams","live":true,"gist":"ESPN’s schedule-adjusted special teams grade. The public cousin of SP+ special teams.","better":"Higher on the 0–100 scale is better. Rank 1 is the best.","body":"The sheet prints an SP+ special teams efficiency rank. SP+ special teams is opponent-adjusted value from kicking, punting, and returns. ESPN’s special teams efficiency is the same job on a 0–100 scale: the unit’s contribution to scoring margin per play, adjusted for the special teams it has faced. We show that. It will not be the same rank as a pure SP+ sheet. Hidden yards (starting field position, punt hang time, kickoff touchbacks) live in here even when the box score looks quiet.","mismatch":"A small spread between otherwise even teams is exactly the spot where a big special teams gap is the whole edge."},{"id":"field-goal-pct","name":"Field goal percentage","group":"Talent, halves, special teams","live":true,"gist":"Field goals made divided by field goals tried.","better":"Higher is better. 100% on five tries is not the same as 100% on twenty.","body":"A finishing and special-teams overlap. September samples are a handful of kicks, so a perfect percentage is mostly “he has not missed yet.” Still worth seeing next to points per game: some teams’ margins are a kicker who is 5-for-5, not an offense that scores touchdowns. The sheet’s red-zone touchdown rate is the deeper version of this question.","mismatch":"Do not treat a perfect early field-goal rate as a weapon that travels. Do notice a kicker who is already missing, because that is points the power rating assumes they will get."},{"id":"net-punt","name":"Net punting average","group":"Talent, halves, special teams","live":true,"gist":"Punt yards, minus the return, averaged.","better":"Higher nets flip field position. Low 40s is solid. High 30s is giving the other offense a short field.","body":"Gross average ignores the returner. Net does not. This is the live piece of average field position we can actually show. A team with a great offense and a 36-yard net punt is donating the hidden yards back. Touchbacks and punts inside the 20 are the rest of the story and are not all populated cleanly, so net is the one number we trust enough to print.","mismatch":"Even teams, uneven punting: the “bad” offense will look better than it is because it starts at the 40."},{"id":"talent-rank","name":"Roster talent rank","group":"Talent, halves, special teams","live":false,"gist":"Who was recruited here. On3 or the 247 composite, usually. Rank 1 is the most talented roster.","better":"Closer to 1 is more blue-chip talent. It is not who is playing well this month.","body":"Talent rank is a roster prior: recruiting ratings rolled up across the team. The sheet uses it two ways. Alone, it tells you the ceiling and the depth. Combined with the five factors, it stops a hot Group of 5 offense from looking like a national champion after three home games. Talent does not block this Saturday. It tells you what usually happens when the play-by-play sample is still small.","mismatch":"Talent rank 4 against talent rank 40 is a problem for the underdog even when the early stats are even. Upsets still happen. They happen less often than a three-game box score suggests."},{"id":"five-factors","name":"Five factors","group":"Talent, halves, special teams","live":false,"gist":"Efficiency, explosiveness, finishing, field position, and turnovers, rolled into a rank.","better":"Rank closer to 1 is a better five-factor profile.","body":"Connelly’s five factors are the spine of the whole sheet: success rate (efficiency), explosiveness, finishing drives, field position, and turnovers. The “raw” rank is those five with no talent prior and a lighter schedule adjustment. The second rank on the sheet folds talent (and schedule) back in, which pulls blue-blood rosters up and hot small-sample teams down. If you only remember two ranks, remember these: raw tells you what the plays look like, adjusted tells you what to believe in September.","mismatch":"Raw rank much better than talent-adjusted rank means the team is outplaying its roster. That can be real. It can also be the schedule. Check SOS before you decide it is a new identity."},{"id":"half-margins","name":"First-half and second-half margin","group":"Talent, halves, special teams","live":false,"gist":"Point margin before the half, and point margin after it.","better":"Positive is outscoring people in that half. The split tells you if they start fast or if they adjust.","body":"A team that is +14 in the first half and +2 in the second half is jumping people and then sitting, or opponents are adjusting at half. A team that is even in the first half and dominant in the second is a halftime-adjustment and conditioning story. Neither is pure skill, and a three-game sample is thin, but the sheet prints both because game scripts (and live betting) care which half the points arrive in. Not in the public team feed as a clean margin, so it stays a reading note.","mismatch":"A slow-starting favorite against a fast-starting dog is how a short spread becomes a sweaty one. It is not, by itself, a reason to fade the better team."},{"id":"ol-vs-dl","name":"OL versus opposing DL","group":"Roster, coaches, the bet","live":false,"gist":"The offensive line’s rank against the defensive line’s rank.","better":"Lower rank is the stronger unit. The gap is the story, not either rank alone.","body":"The sheet puts two ranks in one box: this team’s offensive line and the other team’s defensive front. Rank 11 against rank 2 means the defense’s front is a different class than the line it is about to see, even if both are “good.” These are usually talent or grading ranks, not this year’s PFF chart from a single game. A gap of a few spots is nothing. A gap of 20-plus, with one unit inside the top 10, is a matchup you should expect to see in stuff rate and line yards.","mismatch":"When the line-versus-front gap and the line-yards gap point the same way, stop looking for a clever angle. The game is in the trenches."},{"id":"rb-vs-lb","name":"RB versus opposing LB","group":"Roster, coaches, the bet","live":false,"gist":"Running-back rank against the linebacker rank they have to run through.","better":"Lower rank is better talent at that spot. Read the gap.","body":"Same idea as the line matchup, one level further down the field. Backs against linebackers shows up in rush explosiveness more than in stuff rate. A great back behind a losing line still gets stuffed. A great back behind an even line, against ordinary linebackers, is where the 25-yard runs come from.","mismatch":"If OL/DL is even and RB/LB is a blowout, the explosives are live even though the stuff rate might be ordinary."},{"id":"skill-vs-back7","name":"Skill versus the back seven","group":"Roster, coaches, the bet","live":false,"gist":"Receivers and tight ends against the linebackers and defensive backs.","better":"Lower rank is the more talented group. A big gap is a coverage problem.","body":"The sheet’s third roster box. “Back 7” is the linebackers plus the secondary. This is the passing-game talent matchup, separate from whether the quarterback has time (that is OL/DL and havoc). A loaded receiver room against a patched-together secondary is a PPA-per-pass game, assuming the quarterback is upright.","mismatch":"Skill advantage with a losing trench matchup is a mirage until you check sacks and havoc allowed. The ball has to come out."},{"id":"coaches","name":"Head coach, OC, DC","group":"Roster, coaches, the bet","live":false,"gist":"Who is calling it, and whether the staff is the one that built these numbers.","better":"Not a stat. A continuity check.","body":"The sheet lists the head coach and both coordinators because a coordinator change makes last year’s havoc rate and last year’s pace less trustworthy. Three games into a season, the numbers on the sheet are this staff’s numbers. The names still matter when you are deciding if a tendency (fourth-down aggression, a run-first rate, a two-high shell) is a choice they will stick with when they are trailing. We do not scrape a coach bio into the live card.","mismatch":"New coordinator, old reputation: believe the three games you have, and keep the sample size in the sentence when you talk about it."},{"id":"ats","name":"Against the spread","group":"Roster, coaches, the bet","live":false,"gist":"How many times the team has covered the number.","better":"It is a record, not a skill you should chase. 1–2 after three games is nothing.","body":"ATS wins and losses are graded against the closing number, usually. A team can be 3–0 straight up and 1–2 against the spread if the market keeps setting the right number. The sheet prints it because people anchor on “they always cover.” They do not. Early ATS records are mostly noise plus one weird result. ESPN’s ATS feed for this season is empty on a lot of teams right now, so we explain the row instead of inventing a record. Overall record is on the team header, because that one is real.","mismatch":"Fading a team because it is 0–3 ATS, when the power rating and the matchup both like it, is how you talk yourself out of the right side."},{"id":"overall-record","name":"Overall record","group":"Roster, coaches, the bet","live":true,"gist":"Wins and losses. The conference record sits next to it when we have it.","better":"More wins is a better résumé, not a better team. Strength of record is the correction.","body":"The sheet prints the W-L under each side. We put it on the team header with the conference record (0–0 in conference just means they have not started league play). An undefeated team and a one-loss team can be the same team in power terms. Record is what the poll reacts to. Power rating is what the model thinks. Read them together or you will chase every 3–0.","mismatch":"Same record, different SOS: they are not the same team. That is the whole point of the strength-of-record row."}],"groups":["The line","Power and résumé","Passing","Rushing","Downs and finishing","The side rails","Penalties, takeaways, red zone","Talent, halves, special teams","Roster, coaches, the bet"],"desk":[{"id":"401866470","name":"Kent State Golden Flashes at Eastern Michigan Eagles","short":"KENT @ EMU","date":"2026-11-25T00:00Z","away":"Kent State Golden Flashes","home":"Eastern Michigan Eagles","awayAbbr":"KENT","homeAbbr":"EMU","awayPts":20.0,"homePts":26.5,"pick":"NO PLAY","total":"NO PLAY","conf":"","spread":"EMU -5.5","totalLine":46.5,"model":"dg-split-1"},{"id":"401866471","name":"Miami (OH) RedHawks at Western Michigan Broncos","short":"M-OH @ WMU","date":"2026-11-25T00:00Z","away":"Miami (OH) RedHawks","home":"Western Michigan Broncos","awayAbbr":"M-OH","homeAbbr":"WMU","awayPts":19.5,"homePts":26.0,"pick":"NO PLAY","total":"NO PLAY","conf":"","spread":"WMU -6.5","totalLine":45.5,"model":"dg-split-1"},{"id":"401856879","name":"TCU Horned Frogs at Texas Tech Red Raiders","short":"TCU @ TTU","date":"2026-11-27T01:00Z","aw   if (!Number.isFinite(away) || !Number.isFinite(home)) {
    if (ap == null || hp == null) return null;
    const margin = hp - ap + 2.5;
    const posted = Number(line.total);

}
let PLAY_JOB = null;
