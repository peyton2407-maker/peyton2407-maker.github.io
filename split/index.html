function cellNum(cell) {
  if (!cell || cell.text == null) return null;
  const n = Number(String(cell.text).replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
}
function sheetRow(sheet, sectionId, rowId) {
  const sec = (sheet.sections || []).find((s) => s.id === sectionId);
  return sec ? (sec.rows || []).find((r) => r.id === rowId) : null;
}
function sameSquad(token, abbr) {
  if (token === abbr) return true;
  const alias = { AF: "AFA", AFA: "AF", BUF: "BUFF", BUFF: "BUF" };
  return alias[token] === abbr;
}
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  const a = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * a);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
  return sign * y;
}
function winFromPoints(sheet) {
  const line = sheet.line || {};
  const away = Number(line.fpiAway);
  const home = Number(line.fpiHome);
  if (!Number.isFinite(away) || !Number.isFinite(home)) {
    return line.awayWin && line.homeWin ? sheet.away.abbrev + " " + line.awayWin + " · " + sheet.home.abbrev + " " + line.homeWin : "Not posted";
  }
  const margin = home - away;
  const homePct = Math.round(50 * (1 + erf(margin / 13.8 / Math.SQRT2)));
  const awayPct = 100 - homePct;
  return sheet.away.abbrev + " " + awayPct + "% · " + sheet.home.abbrev + " " + homePct + "%";
}
function impliedFromLine(sheet) {
  const line = sheet.line || {};
  const tot = Number(line.total);
  const sp = String(line.marketSpread || "").replace("−", "-");
  const m = sp.match(/([A-Z0-9&]+)\s*([+-]?\d+\.?\d*)/);
  if (!m || !Number.isFinite(tot)) {
    return line.marketAway && line.marketHome ? sheet.away.abbrev + " " + line.marketAway + " · " + sheet.home.abbrev + " " + line.marketHome : "Needs a spread and a total";
  }
  const num = Number(m[2]);
  let homeSpread = null;
  if (sameSquad(m[1], sheet.home.abbrev)) homeSpread = num;
  else if (sameSquad(m[1], sheet.away.abbrev)) homeSpread = -num;
  if (homeSpread == null) {
    return line.marketAway && line.marketHome ? sheet.away.abbrev + " " + line.marketAway + " · " + sheet.home.abbrev + " " + line.marketHome : "Needs a spread and a total";
  }
  const home = (tot - homeSpread) / 2;
  const away = (tot + homeSpread) / 2;
  return sheet.away.abbrev + " " + away.toFixed(1) + " · " + sheet.home.abbrev + " " + home.toFixed(1);
}
function statsProjection(sheet) {
  if (!sheet) return null;
  const power = sheetRow(sheet, "power", "power-rating");
  const ap = cellNum(power && power.left);
  const hp = cellNum(power && power.right);
  const line = sheet.line || {};
  let away = Number(line.fpiAway);
  let home = Number(line.fpiHome);
  if (!Number.isFinite(away) || !Number.isFinite(home)) {
    if (ap == null || hp == null) return null;
    const margin = hp - ap + 2.5;
    const posted = Number(line.total);
    const tot = Number.isFinite(posted) ? posted : 52;
    home = (tot + margin) / 2;
    away = (tot - margin) / 2;
  }
  const margin = home - away;
  const fav = margin >= 0 ? sheet.home.abbrev : sheet.away.abbrev;
  return { away: away.toFixed(1), home: home.toFixed(1), text: sheet.away.abbrev + " " + away.toFixed(1) + " · " + sheet.home.abbrev + " " + home.toFixed(1) + " · " + fav + " -" + Math.abs(margin).toFixed(1) + " · total " + (away + home).toFixed(1) };
}
GAMES.forEach((game) => {
  const sheet = SHEETS[game.id];
  const proj = statsProjection(sheet);

  game.awayScore = proj.away;
  game.homeScore = proj.home;
  sheet.awayScore = proj.away;
  sheet.homeScore = proj.home;
});

function guideView() {

function statCell(cell, align) {
  const textIsRank = cell.rank != null && (cell.text === String(cell.rank) || cell.text === "#" + cell.rank);
  const tone = textIsRank && cell.rank != null ? textClass(cell.rank) : "";
  const pill = textIsRank ? "" : (cell.rank == null ? "" : `<span class="${pillClass(cell.rank, cell.flatRank === true)}" title="${cell.flatRank ? "#" + cell.rank + " among FBS, most to least" : "#" + cell.rank + " among FBS, 1 is best"}">#${cell.rank}</span>`);
  return `<div class="cell ${align}"><div class="display num ${tone}">${esc(cell.text)}</div><div class="cap">${pill}<span>${esc(cell.caption || "")}</span></div></div>`;

let ADV = null;
const OPENLINE = {};
function loadOpen(id) {
  if (OPENLINE[id]) return;

  fetch("https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=" + id)
    .then((res) => res.json())
    .then((data) => {
      const pc = (data.pickcenter || [])[0] || {};
      const open = pc.pointSpread && pc.pointSpread.home && pc.pointSpread.home.open && pc.pointSpread.home.open.line;
      const now = pc.details || "";
      OPENLINE[id] = open ? "Opened " + open + (now ? " · now " + now : "") : (now || "No open line posted");
      if (String(sheetId) === String(id)) render();
    })
    .catch(() => { OPENLINE[id] = "Open line did not load"; });
}
function advFmt(kind, value) {
  if (value == null || Number.isNaN(Number(value))) return "—";
  if (kind === "pct") return Math.round(Number(value) * 100) + "%";
  if (kind === "yd") return Number(value).toFixed(1);
  if (kind === "raw") return String(value);
  return Number(value).toFixed(2);
}
function advBit(team, row, key, kind) {
  if (!row || row[key] == null || row[key] === "") return team.abbrev + " —";
  const rank = row[key + "_r"];
  return team.abbrev + " " + advFmt(kind, row[key]) + (rank ? " (#" + rank + ")" : "");
}
function advPair(sheet, key, kind) {
  const teams = (ADV && ADV.teams) || {};
  return advBit(sheet.away, teams[sheet.away.id], key, kind) + " · " + advBit(sheet.home, teams[sheet.home.id], key, kind);
}
function talentLine(sheet) {
  const teams = (ADV && ADV.teams) || {};
  const bit = (team) => {
    const row = teams[team.id];
    if (!row || row.talent_r == null) return team.abbrev + " —";
    const grade = row.talent_grade != null ? " · " + Number(row.talent_grade).toFixed(1) : "";
    return team.abbrev + " #" + row.talent_r + grade;
  };
  return bit(sheet.away) + " · " + bit(sheet.home);
}
function advNet(sheet) {
  const teams = (ADV && ADV.teams) || {};
  const bit = (team) => {
    const row = teams[team.id];
    if (!row || row.ppd == null || row.def_ppd == null) return team.abbrev + " —";
    return team.abbrev + " " + (row.ppd - row.def_ppd).toFixed(2);
  };
  return bit(sheet.away) + " · " + bit(sheet.home);
}
function advHalf(sheet) {
  const teams = (ADV && ADV.teams) || {};
  const bit = (team) => {
    const row = teams[team.id];
    if (!row) return team.abbrev + " —";
    const sign = (n) => (n > 0 ? "+" : "") + Number(n).toFixed(1);
    return team.abbrev + " " + sign(row.h1) + " / " + sign(row.h2);
  };
  return bit(sheet.away) + " · " + bit(sheet.home);
}
function adjScore(sheet) {
  const teams = (ADV && ADV.teams) || {};
  const a = teams[sheet.away.id];
  const h = teams[sheet.home.id];
  if (!a || !h || a.ppd == null || h.def_ppd == null || h.ppd == null || a.def_ppd == null) return "Need both teams' drives.";
  const drives = ((a.drives_pg || 12) + (h.drives_pg || 12)) / 2;
  let away = ((a.ppd + h.def_ppd) / 2) * drives - 1.25;
  let home = ((h.ppd + a.def_ppd) / 2) * drives + 1.25;
  away = Math.max(3, away);
  home = Math.max(3, home);
  const margin = home - away;
  const fav = margin >= 0 ? sheet.home.abbrev : sheet.away.abbrev;
  return sheet.away.abbrev + " " + away.toFixed(1) + " · " + sheet.home.abbrev + " " + home.toFixed(1) + " · " + fav + " -" + Math.abs(margin).toFixed(1) + " · total " + (away + home).toFixed(1);
}
function unitRow(sheet, offKey, defKey, offKind, defKind, offLabel, defLabel) {
  const teams = (ADV && ADV.teams) || {};
  const a = teams[sheet.away.id];
  const h = teams[sheet.home.id];
  const bit = (off, def, offTeam, defTeam) => {
    if (!off || !def) return offTeam.abbrev + " —";
    return offTeam.abbrev + " " + offLabel + " " + advFmt(offKind, off[offKey]) + " vs " + defTeam.abbrev + " " + defLabel + " " + advFmt(defKind, def[defKey]);
  };
  return bit(a, h, sheet.away, sheet.home) + " · " + bit(h, a, sheet.home, sheet.away);
}
function advancedBlock(sheet) {

  return groups.map((group) => `<section class="sec"><h2 class="display">${group[0]}</h2><p class="note">From this season's real plays. (#) is the rank, and 1 is the best. Roster talent is the average ESPN grade of the 2024–2026 signees. Coordinators are the 2026 staff. PPA is this sheet's expected-points curve, not ESPN's number.</p><div class="box">${group[1].map((item) => row(item[0], item[1])).join("")}</div></section>`).join("");
}
function levelLabel(team) {
  const name = { P4: "Power 4", Ind: "Independent", G5: "Group of 5", FCS: "FCS" }[team.level] || team.level || "—";
  return team.abbrev + " " + name;
}
function sheetView() {

    return `<a class="back" href="#">Week 4</a><h1 class="display" style="margin-top:16px;text-transform:uppercase">That game isn’t on the sheet</h1><p class="lede">It may be an NFL game. Those stay on Double Gs.</p>`;

  const pane = (side) => {
    const team = sheet[side];
    const score = side === "away" ? sheet.awayScore : sheet.homeScore;
    const leaders = side === "away" ? sheet.awayLeaders : sheet.homeLeaders;
    return `<div class="pane"><div>${logo(team, true)}</div><div class="display abbr">${team.rank != null ? `<span class="rankn">#${team.rank}</span>` : ""}${esc(team.abbrev)}</div><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px">${esc(team.location)}</div><div class="sub">${esc([team.record, team.conference, levelLabel(team).replace(team.abbrev + " ", ""), side==="home"?"Home":"Away"].filter(Boolean).join(" · "))}</div>${score != null ? `<div class="display" style="margin-top:4px;font-size:36px;line-height:1">${score}</div>` : ""}<ul class="leaders">${(leaders||[]).map((l) => `<li><span style="color:var(--fg)">${esc(l.role)}. </span>${esc(l.line)}</li>`).join("")}</ul></div>`;

    ["market-price","Moneyline", `${sheet.away.abbrev} ${line.awayMl || "—"} · ${sheet.home.abbrev} ${line.homeMl || "—"}`],
    ["implied-score","Market implied score", impliedFromLine(sheet)],
    ["stats-spread","Power score", (statsProjection(sheet) || {}).text || "No power rating on one of these teams"],
    ["level","Level", levelLabel(sheet.away) + " · " + levelLabel(sheet.home)],
    ["fpi-spread","FPI spread", line.fpiSpread ? `${line.fpiSpread}${line.fpiAway && line.fpiHome ? ` · split ${sheet.away.abbrev} ${line.fpiAway}, ${sheet.home.abbrev} ${line.fpiHome}` : ""}` : "No FPI on one of these teams"],

  const sections = (sheet.sections || []).map((section) => `<section class="sec"><h2 class="display">${esc(section.title)}</h2><p class="note">${esc(section.note || "")}</p><div class="box">${section.rows.map((row, index) => {

  }).join("")}</div></section>`).join("");

    ${footer()}`;

function render() {

let LINES_STAMP = "";
function applyLiveOdds(id, odds) {
  if (!odds || !odds.details) return false;
  const sheet = SHEETS[id];
  const game = GAMES.find((item) => String(item.id) === String(id));
  const spread = String(odds.details).replace("−", "-");
  const total = odds.overUnder != null ? String(odds.overUnder) : "";
  const ps = odds.pointSpread || {};
  const tot = odds.total || {};
  const ml = odds.moneyline || {};
  const awayJuice = ps.away && ps.away.close && ps.away.close.odds;
  const homeJuice = ps.home && ps.home.close && ps.home.close.odds;
  const spreadPrice = awayJuice && homeJuice ? awayJuice + " / " + homeJuice : (awayJuice || homeJuice || "");
  const overPrice = tot.over && tot.over.close && tot.over.close.odds;
  const underPrice = tot.under && tot.under.close && tot.under.close.odds;
  const awayMl = ml.away && ml.away.close && ml.away.close.odds;
  const homeMl = ml.home && ml.home.close && ml.home.close.odds;
  let changed = false;
  if (sheet && sheet.line) {
    if (sheet.line.marketSpread !== spread || (total && String(sheet.line.total) !== total)) changed = true;
    sheet.line.marketSpread = spread;
    if (total) sheet.line.total = total;
    if (spreadPrice) sheet.line.spreadPrice = spreadPrice;
    if (overPrice) sheet.line.overPrice = "o" + overPrice;
    if (underPrice) sheet.line.underPrice = "u" + underPrice;
    if (awayMl) sheet.line.awayMl = awayMl;
    if (homeMl) sheet.line.homeMl = homeMl;
  }
  if (game) {
    if (game.spread !== spread || (total && String(game.total) !== total)) changed = true;
    game.spread = spread;
    if (total) game.total = total;
  }
  return changed;
}
function refreshLines() {
  const week = (DATA.slate && DATA.slate.week) || 4;
  fetch("https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?week=" + week + "&seasontype=2&groups=80&limit=200")
    .then((res) => res.json())
    .then((board) => {
      let changed = !LINES_STAMP;
      let n = 0;
      (board.events || []).forEach((ev) => {
        const comp = (ev.competitions || [])[0] || {};
        const odds = (comp.odds || []).find((item) => ((item.provider || {}).name || "") === "DraftKings") || (comp.odds || [])[0];
        if (odds && odds.details) n += 1;
        if (applyLiveOdds(ev.id, odds)) changed = true;
      });
      if (!n) return;
      LINES_STAMP = "DraftKings · " + n + " lines · " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      if (changed) render();
    })
    .catch(() => {});
}
document.addEventListener("click", (e) => {

  if (desk) { sessionStorage.setItem("gg-open-game", desk.getAttribute("data-desk")); return; }

  if (smode) { mode = smode.getAttribute("data-smode"); open = null; render(); return; }

  if (filterBtn) { filter = filterBtn.getAttribute("data-filter"); query = ""; render(); return; }
  const opener = e.target.closest("[data-open]");
  if (opener) { const id = opener.getAttribute("data-open"); open = open === id ? null : id; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { query = e.target.value; render(); }
  if (e.target.id === "gq") { guideQuery = e.target.value; render(); }
});
window.addEventListener("hashchange", () => { open = null; render(); });

fetch("advanced.json").then((res) => res.json()).then((data) => { ADV = data; render(); }).catch(() => {});
