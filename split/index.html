  </div>`;
}
function gamesNow() {
  const needle = query.trim().toLowerCase();
  return GAMES.filter((game) => {
    if (needle) {
      const hay = `${game.away.name} ${game.away.location} ${game.away.abbrev} ${game.home.name} ${game.home.location} ${game.home.abbrev} ${game.away.conference} ${game.home.conference}`.toLowerCase();
      return hay.includes(needle);
    }
    if (filter !== "ranked") return true;
    return game.away.rank != null || game.home.rank != null;
  });
}

function cellNum(cell) {
  if (!cell || cell.text == null) return null;
  const n = Number(String(cell.text).replace(/[^0-9.\-]/g, ""));
  return Number.isFinite(n) ? n : null;
}
function sheetRow(sheet, sectionId, rowId) {
  const sec = (sheet.sections || []).find((s) => s.id === sectionId);
  return sec ? (sec.rows || []).find((r) => r.id === rowId) : null;
}
function sameSquad(token, abbr) {
  if (token === abbr) return true;
  const alias = { AF: "AFA", AFA: "AF", BUF: "BUFF", BUFF: "BUF" };
  return alias[token] === abbr;
}
function erf(x) {
  const sign = x < 0 ? -1 : 1;
  const a = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * a);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a);
  return sign * y;
}
function winFromPoints(sheet) {
  const line = sheet.line || {};
  const away = Number(line.fpiAway);
  const home = Number(line.fpiHome);
  if (!Number.isFinite(away) || !Number.isFinite(home)) {
    return line.awayWin && line.homeWin ? sheet.away.abbrev + " " + line.awayWin + " · " + sheet.home.abbrev + " " + line.homeWin : "Not posted";
  }
  const margin = home - away;
  const homePct = Math.round(50 * (1 + erf(margin / 13.8 / Math.SQRT2)));
  const awayPct = 100 - homePct;
  return sheet.away.abbrev + " " + awayPct + "% · " + sheet.home.abbrev + " " + homePct + "%";
}
function impliedFromLine(sheet) {
  const line = sheet.line || {};
  const tot = Number(line.total);
  const sp = String(line.marketSpread || "").replace("−", "-");
  const m = sp.match(/([A-Z0-9&]+)\s*([+-]?\d+\.?\d*)/);
  if (!m || !Number.isFinite(tot)) {
    return line.marketAway && line.marketHome ? sheet.away.abbrev + " " + line.marketAway + " · " + sheet.home.abbrev + " " + line.marketHome : "Needs a spread and a total";
  }
  const num = Number(m[2]);
  let homeSpread = null;
  if (sameSquad(m[1], sheet.home.abbrev)) homeSpread = num;
  else if (sameSquad(m[1], sheet.away.abbrev)) homeSpread = -num;
  if (homeSpread == null) {
    return line.marketAway && line.marketHome ? sheet.away.abbrev + " " + line.marketAway + " · " + sheet.home.abbrev + " " + line.marketHome : "Needs a spread and a total";
  }
  const home = (tot - homeSpread) / 2;
  const away = (tot + homeSpread) / 2;
  return sheet.away.abbrev + " " + away.toFixed(1) + " · " + sheet.home.abbrev + " " + home.toFixed(1);
}
function statsProjection(sheet) {
  if (!sheet) return null;
  const power = sheetRow(sheet, "power", "power-rating");
  const ap = cellNum(power && power.left);
  const hp = cellNum(power && power.right);
  const line = sheet.line || {};
  let away = Number(line.fpiAway);
  let home = Number(line.fpiHome);
  if (!Number.isFinite(away) || !Number.isFinite(home)) {
    if (ap == null || hp == null) return null;
    const margin = hp - ap + 2.5;
    const posted = Number(line.total);
    const tot = Number.isFinite(posted) ? posted : 52;
    home = (tot + margin) / 2;
    away = (tot - margin) / 2;
  }
  const margin = home - away;
  const fav = margin >= 0 ? sheet.home.abbrev : sheet.away.abbrev;
  return { away: away.toFixed(1), home: home.toFixed(1), text: sheet.away.abbrev + " " + away.toFixed(1) + " · " + sheet.home.abbrev + " " + home.toFixed(1) + " · " + fav + " -" + Math.abs(margin).toFixed(1) + " · total " + (away + home).toFixed(1) };
}
GAMES.forEach((game) => {
  const sheet = SHEETS[game.id];
  const proj = statsProjection(sheet);
  if (!proj) return;
  game.awayScore = proj.away;
  game.homeScore = proj.home;
  sheet.awayScore = proj.away;
  sheet.homeScore = proj.home;
});

  };
  return `<a class="card" href="#${esc(game.id)}"><div class="bar" style="background:linear-gradient(90deg,#${game.away.color},#${game.home.color})"></div>
    <div class="meta"><span>${esc(game.when)}</span><span>${esc(game.tv || "")}</span></div>
    ${side("away")}${side("home")}

    ${game.fpiLean ? `<div class="fpi">FPI lean ${esc(game.fpiLean)}</div>` : ""}</a>`;
}

function playEp(ytg) {
  const y = Math.max(1, Math.min(99, Number(ytg)));

  const vals = [6.2, 5.1, 4.1, 3.2, 2.5, 1.8, 1.1, 0.4, -0.2, -0.8, -1.5];
  for (let i = 0; i < knots.length - 1; i += 1) {
    if (y <= knots[i + 1]) {
      const t = (y - knots[i]) / (knots[i + 1] - knots[i]);
      return vals[i] + (vals[i + 1] - vals[i]) * t;
    }
  }
  return vals[vals.length - 1];
}
function playBlank() {

function addPlayGame(summary, bag) {

        if (ok) { offRow.pass_ex_y += yards; offRow.pass_ex_n += 1; }

      ppa: rate(raw.ppa, raw.scrim), success: rate(raw.ok, raw.scrim), expl: rate(raw.ex_y, raw.ex_n),

      pen_pg: raw.pen_against / g, h1: raw.h1 / g, h2: raw.h2 / g, ats, drives_pg: raw.drives / g, points_pg: raw.points / g,

let PLAY_JOB = null;
function refreshPlays() {
