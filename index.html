<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Double Gs — NFL Week 3 projections</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap");

:root {
  --paper: #ebe4d6;
  --paper-2: #e3d9c6;
  --ink: #1c2420;
  --ink-soft: #3d4a43;
  --muted: #66756c;
  --faint: #8b968e;
  --card: #f3eee3;
  --card-2: #ece5d6;
  --line: #d3c6ae;
  --line-2: #c9b896;
  --navy: #24362e;
  --turf: #2f8a52;
  --turf-soft: #e5f5ea;
  --sun: #e09a2b;
  --sun-soft: #fde9c4;
  --sky: #2c6f9a;
  --sky-soft: #e4f1f8;
  --rose: #c45c4a;
  --shadow: 0 10px 28px rgba(36, 54, 46, .08);
  --radius: 22px;
  --safe-b: env(safe-area-inset-bottom, 14px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: Nunito, "Segoe UI", sans-serif;
  color: var(--ink);
  min-height: 100vh;
  background:
    radial-gradient(900px 420px at 100% -10%, rgba(224,154,43,.10), transparent 50%),
    radial-gradient(700px 380px at -10% 0%, rgba(47,138,82,.07), transparent 46%),
    linear-gradient(180deg, #e8e0d0 0%, var(--paper) 42%, #ddd4c3 100%);
}
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; }

.app {
  width: min(1380px, 100%);
  margin: 0 auto;
  padding: 18px 16px calc(32px + var(--safe-b));
}

.topbar {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.brand { display: flex; gap: 14px; align-items: center; }
.mark {
  width: 56px; height: 56px; border-radius: 18px;
  background: linear-gradient(160deg, #f3c15c, #2f8a52);
  color: #142016;
  display: grid; place-items: center;
  font-family: Fraunces, Georgia, serif;
  font-weight: 700; font-size: 18px; letter-spacing: -0.04em;
  box-shadow: 0 8px 0 rgba(36,54,46,.12);
  flex: none;
}
.brand h1 {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(26px, 6vw, 38px);
  letter-spacing: -0.03em;
  font-weight: 700;
  color: var(--navy);
}
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 42ch; }

.meta-chip { display: flex; gap: 8px; flex-wrap: wrap; }
.pill, .refresh-btn {
  border: 1px solid var(--line);
  background: var(--card);
  padding: 8px 12px; border-radius: 999px;
  color: var(--ink-soft); font-size: 13px;
  box-shadow: 0 1px 0 rgba(255,255,255,.8);
}
.refresh-btn { cursor: pointer; }
.refresh-btn:hover { border-color: var(--turf); color: var(--turf); }

.tabs {
  display: flex; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px 16px;
  padding: 6px 16px 12px;
  position: sticky; top: 0; z-index: 8;
  background: linear-gradient(var(--paper) 72%, transparent);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 10px 15px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--ink-soft);
  white-space: nowrap;
  flex: none;
}
.tab.active {
  background: var(--navy);
  color: #f6f1e6;
  border-color: var(--navy);
  font-weight: 800;
}

.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.controls input, .controls select, .lg-select {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  min-width: 0;
  box-shadow: var(--shadow);
}
.controls input { flex: 1 1 220px; }
.controls select { flex: 1 1 150px; }
.lg-select { min-height: 52px !important; font-size: 15px !important; flex: 1 1 200px; }

.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.stat b {
  display: block;
  font-family: Fraunces, Georgia, serif;
  font-size: 26px; color: var(--navy);
}
.stat span { color: var(--muted); font-size: 12.5px; }

.board, .prop-board {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.board-card { grid-column: 1 / -1; }

.game, .prop-card, .card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.game { display: grid; gap: 12px; cursor: pointer; }
.game:hover, .prop-card:hover { transform: translateY(-2px); border-color: var(--line-2); background: var(--card-2); }
.game.done { opacity: .7; }
.prop-card { cursor: pointer; }

.scorebox, .yardgrid > div, .simgrid > div, .wxbar > div, .kv, .prop-stats div {
  background: #e8e1d2;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 12px;
}
.scoreline {
  display: flex; justify-content: center; gap: 12px;
  align-items: baseline; margin-top: 4px;
}
.scoreline b {
  font-family: Fraunces, Georgia, serif;
  font-size: clamp(28px, 8vw, 36px);
  color: var(--navy);
}
.score-dash { color: var(--faint); }
.total-line { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }
.total-line b { color: var(--ink); }

.yardgrid, .wxbar, .simgrid, .prop-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.yardgrid b, .wxbar b, .prop-stats b { display: block; font-size: 17px; margin-top: 2px; }
.prop-preview { color: var(--turf); font-size: 13px; font-weight: 800; }

.tablewrap { overflow-x: auto; display: none; }
.boardtable, .ratings, .props { width: 100%; border-collapse: collapse; }
.boardtable { min-width: 720px; }
.boardtable th, .boardtable td,
.ratings th, .ratings td,
.props th, .props td {
  text-align: left; padding: 10px 8px;
  border-bottom: 1px solid var(--line); font-size: 13px;
}
.boardtable th, .ratings th, .props th {
  color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
}
.boardtable tr[data-id] { cursor: pointer; }
.boardtable tr[data-id]:hover td { background: var(--sun-soft); }

.matchup { display: flex; flex-direction: column; gap: 8px; }
.team { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
.team img { width: 30px; height: 30px; object-fit: contain; }
.team .name { font-weight: 800; }
.team .sub, .kick, .prop-meta, .simtails, .subn { color: var(--muted); font-size: 12.5px; }
.rank { color: var(--sun); font-size: 11px; font-weight: 800; margin-right: 6px; }

.lbl { font-size: 11px; color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
.num { font-size: 18px; font-weight: 800; margin-top: 2px; }

.badge {
  display: inline-block; margin-top: 6px; margin-right: 6px;
  padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800;
}
.badge.play { background: var(--turf-soft); color: var(--turf); }
.badge.pass { background: #ddd6c8; color: var(--faint); }
.badge.over { background: var(--sky-soft); color: var(--sky); }
.badge.under { background: var(--sun-soft); color: #9a6a12; }

.wxchip {
  display: inline-flex; width: fit-content;
  border: 1px solid var(--line); background: #e8e1d2;
  padding: 5px 10px; border-radius: 999px;
  font-size: 12px; color: var(--ink-soft);
}
.wxchip.wx-harsh { background: var(--sun-soft); color: #8a5a10; }
.wxchip.wx-wet { background: var(--sky-soft); color: var(--sky); }
.wx-note { color: #9a6a12; font-size: 13px; margin-top: 8px; }

.rteam { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.rteam img { width: 22px; height: 22px; }
.model, .news { display: grid; gap: 14px; }
.card h3 {
  margin: 0 0 10px;
  font-family: Fraunces, Georgia, serif;
}
.card p, .card li { color: var(--muted); line-height: 1.6; }
.news-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
.news-item a { color: var(--navy); text-decoration: none; font-weight: 800; }
.news-item small { color: var(--faint); display: block; margin-top: 4px; }

.overlay {
  position: fixed; inset: 0; background: rgba(28,36,32,.55);
  display: none; align-items: flex-end; justify-content: center; z-index: 20;
}
.overlay.show { display: flex; }
.modal {
  width: 100%; max-height: 92vh; overflow: auto;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 18px 16px calc(20px + var(--safe-b));
}
.modal-head { display: flex; justify-content: space-between; gap: 10px; }
.close {
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 12px; cursor: pointer;
}
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 16px 0; }
.side { text-align: center; }
.side img { width: 58px; height: 58px; }
.side h2 { margin: 8px 0 0; font-family: Fraunces, Georgia, serif; font-size: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 8px; }
.kv b { display: block; font-size: 17px; }
.inj { color: var(--rose); font-size: 10px; font-weight: 800; margin-left: 6px; }
.empty { color: var(--muted); padding: 48px 12px; text-align: center; }

.prop-card .who { display: flex; justify-content: space-between; gap: 8px; }
.prop-card h4 { margin: 0; font-size: 17px; }
.pick-score {
  background: var(--turf-soft); color: var(--turf);
  font-weight: 800; border-radius: 999px; padding: 5px 10px; font-size: 12px;
}

@media (min-width: 760px) {
  .app { padding: 28px 28px 70px; }
  .topbar { grid-template-columns: 1fr auto; align-items: end; }
  .stat-row { grid-template-columns: repeat(4, 1fr); }
  .yardgrid, .wxbar, .simgrid { grid-template-columns: repeat(4, 1fr); }
  .prop-stats { grid-template-columns: repeat(3, 1fr); }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .overlay { align-items: center; padding: 28px; }
  .modal { width: min(880px, 100%); border-radius: 24px; max-height: 90vh; padding: 24px; }
  .tablewrap { display: block; }
  .tabs { margin: 0 0 18px; padding: 0; position: static; background: none; }
  .prop-board { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 1100px) {
  .board { grid-template-columns: 1fr 1fr; }
  .prop-board { grid-template-columns: 1fr 1fr 1fr; }
  .model, .news { grid-template-columns: 1.15fr .85fr; }
}
</style>

function weatherCodeLabel(code) {
  const c = Number(code);
  if (c === 0) return "Clear";
  if (c === 1) return "Mostly clear";
  if (c === 2) return "Partly cloudy";
  if (c === 3) return "Overcast";
  if (c === 45 || c === 48) return "Fog";
  if (c >= 51 && c <= 57) return "Drizzle";
  if (c >= 61 && c <= 67) return "Rain";
  if (c >= 71 && c <= 77) return "Snow";
  if (c >= 80 && c <= 82) return "Showers";
  if (c === 85 || c === 86) return "Snow showers";
  if (c === 95) return "Thunderstorm";
  if (c === 96 || c === 99) return "T-storm + hail";
  return "Mixed";
}

function coordsForGame(g) {
  if (g.lat && g.lon) return [Number(g.lat), Number(g.lon)];
  const city = (g.city || "").trim();
  if (CITY_COORDS[city]) return CITY_COORDS[city];
  for (const [k, v] of Object.entries(CITY_COORDS)) {
    if (city.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(city.toLowerCase())) return v;
  }
  return null;
}

function weatherImpact(wx, indoor) {
  if (indoor) {
    return { adj: 0, rush_mult: 1, rec_mult: 1, note: "Climate-controlled dome — no weather tax.", harsh: false, wet: false };
  }
  if (!wx) return { adj: 0, rush_mult: 1, rec_mult: 1, note: "No forecast loaded.", harsh: false, wet: false };
  const t = Number(wx.temp_f);
  const wind = Number(wx.wind_mph) || 0;
  const gust = Number(wx.wind_gust_mph) || wind;
  const precip = Number(wx.precip_prob) || 0;
  const inch = Number(wx.precip_in) || 0;
  const code = Number(wx.weather_code) || 0;
  let adj = 0;
  let rush = 1, rec = 1;
  const bits = [];
  // Wind: passing/kicking suffer first
  if (gust >= 25 || wind >= 18) {
    const w = Math.min(5.2, (Math.max(wind, gust * 0.72) - 14) * 0.28);
    adj -= w;
    rec *= 1 - Math.min(0.12, w * 0.018);
    rush *= 1 + Math.min(0.06, w * 0.01);
    bits.push(`Wind ${Math.round(wind)} mph (gust ${Math.round(gust)}) cuts the total ~${w.toFixed(1)}`);
  } else if (wind >= 12) {
    adj -= 0.6;
    bits.push("Breezy enough to nudge deep shots down.");
  }
  // Precip / field
  const wet = precip >= 40 || inch >= 0.08 || (code >= 61 && code <= 86) || (code >= 51 && code <= 57 && precip >= 30);
  if (wet) {
    const rainHit = Math.min(3.8, 0.8 + precip / 40 + inch * 2.4);
    adj -= rainHit;
    rec *= 0.94;
    rush *= 1.04;
    bits.push(`Precip ${precip}% / ${inch.toFixed(2)}" — expect shorter throws and more run.`);
  }
  if (code >= 71 && code <= 86) {
    adj -= 1.4;
    rec *= 0.93;
    rush *= 0.98;
    bits.push("Snow/wintry mix: footing and ball handling tax both sides.");
  }
  if (code >= 95) {
    adj -= 1.1;
    bits.push("Thunder risk can slow pace / delay.");
  }
  // Temperature extremes
  if (Number.isFinite(t)) {
    if (t <= 25) {
      const cold = Math.min(3.2, (25 - t) * 0.12 + 0.8);
      adj -= cold;
      rec *= 0.96;
      bits.push(`Cold ${Math.round(t)}°F suppresses scoring ~${cold.toFixed(1)}`);
    } else if (t <= 35) {
      adj -= 0.7;
      bits.push("Cold-weather game: slightly lower total.");
    } else if (t >= 92) {
      const heat = Math.min(1.6, (t - 90) * 0.18);
      adj -= heat;
      bits.push(`Heat ${Math.round(t)}°F can slow 4th-quarter pace.`);
    }
  }
  adj = Math.max(-7.5, Math.min(0.4, +adj.toFixed(2)));
  const harsh = adj <= -2.0 || wind >= 20 || t <= 28;
  return {
    adj,
    rush_mult: +rush.toFixed(3),
    rec_mult: +rec.toFixed(3),
    note: bits.length ? bits.join(" ") : "Benign conditions — little weather tax.",
    harsh,
    wet,
  };
}

function applyWeatherToGame(g) {
  const impact = weatherImpact(g.weather, g.indoor);
  g.weather_impact = impact;
  if (!g.proj) return g;
  g.proj.weather_adj_total = impact.adj;
  if (g.proj.hashmark_total != null && !g._wxApplied) {
    const tot = Number(g.proj.hashmark_total) + impact.adj;
    g.proj.hashmark_total = +tot.toFixed(1);
    if (g.proj.blended_margin != null) {
      g.proj.home_points = +Math.max(3, (tot + Number(g.proj.blended_margin)) / 2).toFixed(1);
      g.proj.away_points = +Math.max(3, (tot - Number(g.proj.blended_margin)) / 2).toFixed(1);
    }
    if (g.box) {
      g.box.total_points = g.proj.hashmark_total;
      g.box.home_points = g.proj.home_points;
      g.box.away_points = g.proj.away_points;
      if (g.box.home_rush_yds != null) g.box.home_rush_yds = +(g.box.home_rush_yds * impact.rush_mult).toFixed(1);
      if (g.box.away_rush_yds != null) g.box.away_rush_yds = +(g.box.away_rush_yds * impact.rush_mult).toFixed(1);
      if (g.box.home_rec_yds != null) g.box.home_rec_yds = +(g.box.home_rec_yds * impact.rec_mult).toFixed(1);
      if (g.box.away_rec_yds != null) g.box.away_rec_yds = +(g.box.away_rec_yds * impact.rec_mult).toFixed(1);
    }
    if (g.odds?.total != null) {
      g.proj.edge_total = +(g.proj.hashmark_total - Number(g.odds.total)).toFixed(2);
      if (Math.abs(g.proj.edge_total) < 0.8) g.proj.total_pick = "NO PLAY";
      else g.proj.total_pick = g.proj.edge_total > 0 ? `OVER ${g.odds.total}` : `UNDER ${g.odds.total}`;
    }
    g._wxApplied = true;
  }
  return g;
}

async function fetchOpenMeteo(lat, lon, iso) {
  const kick = iso ? new Date(iso) : new Date();
  const day = kick.toISOString().slice(0, 10);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,weathercode,windspeed_10m,windgusts_10m,relativehumidity_2m&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,windspeed_10m_max,windgusts_10m_max&temperature_unit=fahrenheit&windspeed_unit=mph&precipitation_unit=inch&timezone=auto&start_date=${day}&end_date=${day}`;
  const j = await getJSON(url);
  const hours = j.hourly || {};
  const times = hours.time || [];
  let idx = 0;
  if (times.length) {
    const target = kick.getTime();
    let best = 0, bestD = Infinity;
    times.forEach((t, i) => {
      const d = Math.abs(new Date(t).getTime() - target);
      if (d < bestD) { bestD = d; best = i; }
    });
    idx = best;
  }
  const daily = j.daily || {};
  const temp = hours.temperature_2m?.[idx] ?? daily.temperature_2m_max?.[0];
  const wind = hours.windspeed_10m?.[idx] ?? daily.windspeed_10m_max?.[0];
  const gust = hours.windgusts_10m?.[idx] ?? daily.windgusts_10m_max?.[0];
  const precipP = hours.precipitation_probability?.[idx] ?? daily.precipitation_probability_max?.[0] ?? 0;
  const precipI = hours.precipitation?.[idx] ?? 0;
  const code = hours.weathercode?.[idx] ?? daily.weathercode?.[0];
  const rh = hours.relativehumidity_2m?.[idx];
  return {
    source: "Open-Meteo",
    lat, lon,
    hour: times[idx] || day,
    temp_f: temp != null ? +Number(temp).toFixed(1) : null,
    temp_max_f: daily.temperature_2m_max?.[0] ?? null,
    temp_min_f: daily.temperature_2m_min?.[0] ?? null,
    wind_mph: wind != null ? +Number(wind).toFixed(1) : null,
    wind_gust_mph: gust != null ? +Number(gust).toFixed(1) : null,
    precip_prob: precipP != null ? Math.round(Number(precipP)) : null,
    precip_in: precipI != null ? +Number(precipI).toFixed(2) : 0,
    precip_day_in: daily.precipitation_sum?.[0] ?? null,
    weather_code: code,
    condition: weatherCodeLabel(code),
    humidity: rh != null ? Math.round(Number(rh)) : null,
  };
}

function residualFor(league, teamId) {
  const r = getResiduals()[league] || {};
  return r[String(teamId)] || { n: 0, margin: 0, total: 0, off: 0, def: 0 };
}

function learnFromFinals(games) {
  const res = getResiduals();
  let learned = 0;
  (games || []).forEach((g) => {
    if (!g.completed || !g.home || !g.away) return;
    const hid = String(g.id);
    if (res.games_learned[hid]) return;
    const hs = Number(g.home.score);
    const as = Number(g.away.score);
    if (!Number.isFinite(hs) || !Number.isFinite(as)) return;
    const p = g.proj || {};
    const predM = p.blended_margin != null ? Number(p.blended_margin) : null;
    const predT = p.hashmark_total != null ? Number(p.hashmark_total) : null;
    const actM = hs - as;
    const actT = hs + as;
    if (predM == null || predT == null || Number.isNaN(predT)) return;
    const errM = actM - predM;
    const errT = actT - predT;
    const lg = g.league === "nfl" ? "nfl" : "cfb";
    function bump(id, marginShare, offShare, defShare) {
      const k = String(id);
      const row = res[lg][k] || { n: 0, margin: 0, total: 0, off: 0, def: 0 };
      const n = row.n + 1;
      const w = 1 / n;
      // fading average: new games count more early, then stabilize
      const a = n <= 4 ? 0.45 : n <= 10 ? 0.22 : 0.12;
      row.n = n;
      row.margin = +(row.margin * (1 - a) + marginShare * a).toFixed(3);
      row.total = +(row.total * (1 - a) + errT * a).toFixed(3);
      row.off = +(row.off * (1 - a) + offShare * a).toFixed(3);
      row.def = +(row.def * (1 - a) + defShare * a).toFixed(3);
      res[lg][k] = row;
    }
    // home residual gets +errM (they outscored the projection), away gets -errM
    const homeOff = (hs - (p.home_points || hs)) ;
    const awayOff = (as - (p.away_points || as));
    bump(g.home.id, errM, homeOff, -(as - (p.away_points || as)));
    bump(g.away.id, -errM, awayOff, -(hs - (p.home_points || hs)));
    res.games_learned[hid] = {
      when: g.date, league: lg, name: g.short_name || g.name,
      actual: `${as}-${hs}`, pred: `${p.away_points}-${p.home_points}`,
      err_margin: +errM.toFixed(2), err_total: +errT.toFixed(2)
    };
    res.history.push({
      id: hid, name: g.short_name || g.name, league: lg,
      err_margin: +errM.toFixed(2), err_total: +errT.toFixed(2)
    });
    if (res.history.length > 80) res.history = res.history.slice(-80);
    learned++;
  });
  return learned;
}

function applyLearningToGame(g) {
  if (!g || !g.proj || g.completed) return g;
  const lg = g.league === "nfl" ? "nfl" : "cfb";
  const hr = residualFor(lg, g.home.id);
  const ar = residualFor(lg, g.away.id);
  const hm = (hr.margin || 0) - (ar.margin || 0);
  const totShift = 0.35 * ((hr.total || 0) + (ar.total || 0)) / 2;
  const p = g.proj;
  if (p.blended_margin != null && Math.abs(hm) > 0.05) {
    p.blended_margin = +(Number(p.blended_margin) + 0.55 * hm).toFixed(2);
    p.hashmark_home_spread = +(-p.blended_margin).toFixed(1);
  }
  if (p.hashmark_total != null && Math.abs(totShift) > 0.05) {
    p.hashmark_total = +(Number(p.hashmark_total) + totShift).toFixed(1);
  }
  if (p.blended_margin != null && p.hashmark_total != null) {
    p.home_points = +Math.max(3, (Number(p.hashmark_total) + Number(p.blended_margin)) / 2).toFixed(1);
    p.away_points = +Math.max(3, (Number(p.hashmark_total) - Number(p.blended_margin)) / 2).toFixed(1);
  }
  if (g.odds && g.odds.home_spread != null && p.blended_margin != null) {
    const mktMargin = -Number(g.odds.home_spread);
    p.edge_spread = +(p.blended_margin - mktMargin).toFixed(2);
  }
  if (g.odds && g.odds.total != null && p.hashmark_total != null) {
    p.edge_total = +(p.hashmark_total - Number(g.odds.total)).toFixed(2);
    if (Math.abs(p.edge_total) < 0.8) p.total_pick = "NO PLAY";
    else p.total_pick = p.edge_total > 0 ? `OVER ${g.odds.total}` : `UNDER ${g.odds.total}`;
  }
  p.learned = { home_n: hr.n, away_n: ar.n, margin_shift: +(0.55 * hm).toFixed(2), total_shift: +totShift.toFixed(2) };
  if (g.box) {
    g.box.home_points = p.home_points;
    g.box.away_points = p.away_points;
    g.box.total_points = p.hashmark_total;
  }
  return g;
}

async function attachWeather(games) {
  const jobs = [];
  const cache = new Map();
  for (const g of games) {
    if (g.indoor) {
      g.weather = { indoor: true, condition: "Dome", temp_f: 72, wind_mph: 0, precip_prob: 0, precip_in: 0 };
      applyWeatherToGame(g);
      continue;
    }
    if (g.completed && g.weather) { applyWeatherToGame(g); continue; }
    const xy = coordsForGame(g);
    if (!xy) { applyWeatherToGame(g); continue; }
    const key = xy.map((n) => n.toFixed(2)).join(",") + "|" + String(g.date || "").slice(0, 13);
    jobs.push([g, key, xy]);
  }
  await poolMap(jobs, 5, async ([g, key, xy]) => {
    try {
      if (!cache.has(key)) cache.set(key, await fetchOpenMeteo(xy[0], xy[1], g.date));
      g.weather = cache.get(key);
    } catch (err) {
      console.warn("weather", g.short_name, err);
    }
    applyWeatherToGame(g);
  });
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function erf(x) {
  const s = Math.sign(x);

  const a1 = 0.254829592, a2 = -0.284496736, a3 = 1.421413741, a4 = -1.453152027, a5 = 1.061405429, p = 0.3275911;
  const t = 1 / (1 + p * x);

}
function normCdf(x) { return 0.5 * (1 + erf(x / Math.sqrt(2))); }

function extractOdds(comp) {

  const ml = raw.moneyline || {};
  const homeMl = ml.home?.close?.odds;
  const awayMl = ml.away?.close?.odds;
  let homeSpread = null;
  if (raw.spread != null) {
    const s = Math.abs(Number(raw.spread));
    if (homeOdds.favorite) homeSpread = -s;
    else if (awayOdds.favorite) homeSpread = s;
    else homeSpread = 0;
  }
  return {
    book: raw.provider?.displayName || raw.provider?.name,

function parseGames(payload, league) {
  if (!payload) return [];
  const week = payload.week?.number;
  return (payload.events || []).map((ev) => {
    const comp = (ev.competitions || [])[0] || {};
    const comps = comp.competitors || [];
    const home = comps.find((x) => x.homeAway === "home");
    const away = comps.find((x) => x.homeAway === "away");
    if (!home || !away) return null;
    const venue = comp.venue || {};
    const addr = venue.address || {};
    const status = comp.status?.type || ev.status?.type || {};
    const broadcasts = [];
    (comp.broadcasts || []).forEach((b) => broadcasts.push(...(b.names || [])));
    if (comp.broadcast && !broadcasts.includes(comp.broadcast)) broadcasts.push(comp.broadcast);
    return {
      id: String(ev.id || comp.id),
      league,
      name: ev.name,
      short_name: ev.shortName,
      date: ev.date || comp.date,
      status: status.name || status.description,
      status_detail: status.shortDetail || status.detail,
      completed: !!status.completed,

function fpiMap(payload, league) {

  const fpiNames = leagueCats.fpi?.names || [];

  (payload.teams || []).forEach((row) => {
    const team = row.team || {};
    const tid = String(team.id || "");

    (row.categories || []).forEach((c) => { cats[c.name] = c; });
    const kv = {};
    fpiNames.forEach((n, i) => { kv[n] = (cats.fpi?.values || [])[i]; });
    const pk = {};
    projNames.forEach((n, i) => { pk[n] = (cats.projections?.values || [])[i]; });

  });
  return out;
}

function projectGame(game, ratings) {
  const league = game.league;
  const hr = ratings[game.home.id] || {};
  const ar = ratings[game.away.id] || {};
  let hfa = game.neutral ? 0 : (league === "nfl" ? LIVE.NFL_HFA : LIVE.CFB_HFA);
  if (game.country && !["", "USA", "US", "United States"].includes(game.country) && !game.neutral) hfa *= 0.35;
  let modelMargin = (hr.fpi != null && ar.fpi != null) ? Number(hr.fpi) - Number(ar.fpi) + hfa : null;
  const odds = game.odds || {};
  const mktHomeSpread = odds.home_spread;
  const mktMargin = mktHomeSpread != null ? -mktHomeSpread : null;
  const mw = league === "nfl" ? LIVE.MARKET_WEIGHT_NFL : LIVE.MARKET_WEIGHT_CFB;
  let blendedMargin = null;
  if (modelMargin != null && mktMargin != null) blendedMargin = mw * mktMargin + (1 - mw) * modelMargin;
  else blendedMargin = modelMargin ?? mktMargin;
  const sigma = league === "nfl" ? LIVE.NFL_SIGMA : LIVE.CFB_SIGMA;
  const winHome = blendedMargin != null ? normCdf(blendedMargin / sigma) : null;
  let modelTotal = null;
  if (league === "nfl" && hr.off != null && ar.off != null) {
    const homePts = LIVE.NFL_AVG_TOTAL / 2 + (hr.off || 0) - (ar.def || 0) + 0.45 * hfa;
    const awayPts = LIVE.NFL_AVG_TOTAL / 2 + (ar.off || 0) - (hr.def || 0) - 0.45 * hfa;
    modelTotal = homePts + awayPts;
  } else if (modelMargin != null) {
    const gap = Math.abs((hr.fpi || 0) - (ar.fpi || 0));
    modelTotal = LIVE.CFB_AVG_TOTAL + Math.min(6, gap * 0.08);
  }
  const mktTotal = odds.total;
  let blendedTotal = null;
  if (modelTotal != null && mktTotal != null) blendedTotal = mw * Number(mktTotal) + (1 - mw) * modelTotal;
  else blendedTotal = modelTotal ?? mktTotal;
  const edgeSpread = blendedMargin != null && mktMargin != null ? blendedMargin - mktMargin : null;
  const edgeTotal = blendedTotal != null && mktTotal != null ? blendedTotal - Number(mktTotal) : null;
  let pick = null, pickLine = null;
  if (edgeSpread != null && mktHomeSpread != null) {
    if (Math.abs(edgeSpread) < 0.6) pick = "NO PLAY";
    else if (edgeSpread > 0) { pick = game.home.abbr; pickLine = `${game.home.abbr} ${mktHomeSpread >= 0 ? "+" : ""}${mktHomeSpread.toFixed(1)}`; }
    else { pick = game.away.abbr; pickLine = `${game.away.abbr} ${(-mktHomeSpread) >= 0 ? "+" : ""}${(-mktHomeSpread).toFixed(1)}`; }
  }
  let totalPick = null;
  if (edgeTotal != null && mktTotal != null) {
    if (Math.abs(edgeTotal) < 0.8) totalPick = "NO PLAY";
    else totalPick = edgeTotal > 0 ? `OVER ${mktTotal}` : `UNDER ${mktTotal}`;
  }
  let homePoints = null, awayPoints = null;
  if (blendedMargin != null && blendedTotal != null) {
    homePoints = Math.max(3, (Number(blendedTotal) + Number(blendedMargin)) / 2);
    awayPoints = Math.max(3, (Number(blendedTotal) - Number(blendedMargin)) / 2);
  }
  return {
    home_fpi: hr.fpi, away_fpi: ar.fpi,
    home_fpi_rank: hr.fpi_rank, away_fpi_rank: ar.fpi_rank,
    home_off: hr.off, home_def: hr.def, away_off: ar.off, away_def: ar.def,
    hfa: +hfa.toFixed(2),
    model_margin: modelMargin != null ? +modelMargin.toFixed(2) : null,
    market_margin: mktMargin != null ? +mktMargin.toFixed(2) : null,
    blended_margin: blendedMargin != null ? +blendedMargin.toFixed(2) : null,
    model_home_spread: modelMargin != null ? +(-modelMargin).toFixed(1) : null,
    hashmark_home_spread: blendedMargin != null ? +(-blendedMargin).toFixed(1) : null,
    win_prob_home: winHome != null ? +winHome.toFixed(4) : null,
    win_prob_away: winHome != null ? +(1 - winHome).toFixed(4) : null,
    model_total: modelTotal != null ? +modelTotal.toFixed(2) : null,
    hashmark_total: blendedTotal != null ? +Number(blendedTotal).toFixed(1) : null,
    home_points: homePoints != null ? +homePoints.toFixed(1) : null,
    away_points: awayPoints != null ? +awayPoints.toFixed(1) : null,
    edge_spread: edgeSpread != null ? +edgeSpread.toFixed(2) : null,
    edge_total: edgeTotal != null ? +edgeTotal.toFixed(2) : null,
    pick, pick_line: pickLine, total_pick: totalPick,
    confidence: edgeSpread != null ? Math.min(96, Math.floor(38 + Math.abs(edgeSpread) * 14 + (hr.fpi && ar.fpi ? 8 : 0))) : 0,
    weather_adj_total: 0,
    missing_ratings: !(hr.fpi != null && ar.fpi != null),
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rand) {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  while (v === 0) v = rand();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}
function pctile(xs, q) {
  const ys = xs.slice().sort((a, b) => a - b);
  const i = Math.min(ys.length - 1, Math.max(0, Math.round(q * (ys.length - 1))));
  return ys[i];
}
function simulateGame(game) {
  const p = game.proj || {};
  const o = game.odds || {};
  if (p.blended_margin == null || p.hashmark_total == null) return null;
  const nfl = game.league === "nfl";
  const sigmaM = nfl ? LIVE.NFL_SIGMA : LIVE.CFB_SIGMA;
  const sigmaT = nfl ? 10.5 : 13.5;
  const shockM = nfl ? 14 : 21;
  const shockT = nfl ? 9 : 12;
  const lowCut = nfl ? 30 : 35;
  const highCut = nfl ? 55 : 70;
  const blow = nfl ? 17 : 21;
  const n = (LIVE.SIM_N || 150000);
  const rand = mulberry32(Number(String(game.id || "1").slice(-9)) || 1);
  const home = [], away = [], tots = [];
  let ch = 0, ca = 0, ps = 0, ov = 0, un = 0, pt = 0, hw = 0, bh = 0, ba = 0, lo = 0, hi = 0;
  for (let i = 0; i < n; i++) {
    const u = rand();
    let m, t;
    if (u < 0.02) {
      m = p.blended_margin + gauss(rand) * sigmaM * 1.35;
      t = p.hashmark_total + gauss(rand) * sigmaT * 1.25;
    } else {
      m = p.blended_margin + gauss(rand) * sigmaM * 0.82;
      t = p.hashmark_total + gauss(rand) * sigmaT * 0.78;
    }
    t = Math.max(16, t);
    const hp = Math.max(0, (t + m) / 2);
    const ap = Math.max(0, (t - m) / 2);
    home.push(hp); away.push(ap); tots.push(hp + ap);
    if (hp > ap) hw++;
    if (hp - ap >= blow) bh++;
    if (ap - hp >= blow) ba++;
    if (hp + ap <= lowCut) lo++;
    if (hp + ap >= highCut) hi++;
    if (o.home_spread != null) {
      const diff = hp - ap + o.home_spread;
      if (Math.abs(diff) < 0.25) ps++;
      else if (diff > 0) ch++;
      else ca++;
    }
    if (o.total != null) {
      if (Math.abs(hp + ap - o.total) < 0.25) pt++;
      else if (hp + ap > o.total) ov++;
      else un++;
    }
  }
  return {
    n,
    home_win: +(hw / n).toFixed(3), away_win: +((1 - hw / n)).toFixed(3),
    cover_home: o.home_spread == null ? null : +(ch / n).toFixed(3),
    cover_away: o.home_spread == null ? null : +(ca / n).toFixed(3),
    push_spread: o.home_spread == null ? null : +(ps / n).toFixed(3),
    over: o.total == null ? null : +(ov / n).toFixed(3),
    under: o.total == null ? null : +(un / n).toFixed(3),
    push_total: o.total == null ? null : +(pt / n).toFixed(3),
    blowout_home: +(bh / n).toFixed(3), blowout_away: +(ba / n).toFixed(3),
    low_scoring: +(lo / n).toFixed(3), high_scoring: +(hi / n).toFixed(3),
    away_p10: +pctile(away, 0.1).toFixed(1), away_p90: +pctile(away, 0.9).toFixed(1),
    home_p10: +pctile(home, 0.1).toFixed(1), home_p90: +pctile(home, 0.9).toFixed(1),
    away_p25: +pctile(away, 0.25).toFixed(1), away_p75: +pctile(away, 0.75).toFixed(1),
    home_p25: +pctile(home, 0.25).toFixed(1), home_p75: +pctile(home, 0.75).toFixed(1),
    total_p10: +pctile(tots, 0.1).toFixed(1), total_p90: +pctile(tots, 0.9).toFixed(1),
    total_p25: +pctile(tots, 0.25).toFixed(1), total_p75: +pctile(tots, 0.75).toFixed(1),
  };
}

async function fetchTeamProfile(league, teamId) {
  const slug = league === "nfl" ? "nfl" : "college-football";
  const prior = LIVE.PRIORS[league];
  try {
    const payload = await getJSON(`https://site.api.espn.com/apis/site/v2/sports/football/${slug}/teams/${teamId}/statistics`);
    const cats = payload.results?.stats?.categories || [];
    const gp = statVal(cats, "rushing", "teamGamesPlayed") || statVal(cats, "passing", "teamGamesPlayed") || 0;
    let allowed = statVal(cats, "defensive", "yardsAllowed");
    if (gp && allowed != null) allowed = allowed / gp;
    return {
      rush_ypg: statVal(cats, "rushing", "rushingYardsPerGame") ?? prior.rush,
      rec_ypg: statVal(cats, "receiving", "receivingYardsPerGame") || statVal(cats, "passing", "passingYardsPerGame") || prior.rec,
      yards_allowed_pg: allowed ?? prior.allowed,
      ppg: statVal(cats, "scoring", "totalPointsPerGame") ?? prior.ppg,
      gp,
    };
  } catch {
    return { rush_ypg: prior.rush, rec_ypg: prior.rec, yards_allowed_pg: prior.allowed, ppg: prior.ppg, gp: 0 };
  }
}

function blendOwn(own, leagueAvg, gp, league) {
  const w = league === "nfl" ? (gp >= 10 ? 0.72 : 0.55) : (gp <= 1 ? 0.28 : Math.min(0.65, 0.28 + gp * 0.12));
  return w * own + (1 - w) * leagueAvg;
}

function projectBox(game, profiles) {
  const league = game.league;
  const prior = LIVE.PRIORS[league];
  const hp = profiles[`${league}:${game.home.id}`] || {};
  const ap = profiles[`${league}:${game.away.id}`] || {};
  const p = game.proj || {};
  if (p.blended_margin == null || p.hashmark_total == null) return null;
  let homePts = Math.max(3, (Number(p.hashmark_total) + Number(p.blended_margin)) / 2);
  let awayPts = Math.max(3, (Number(p.hashmark_total) - Number(p.blended_margin)) / 2);
  const drift = homePts + awayPts - Number(p.hashmark_total);
  homePts -= drift / 2; awayPts -= drift / 2;

  function side(off, defn, pts, scriptMargin) {
    const rushOwn = blendOwn(off.rush_ypg ?? prior.rush, prior.rush, off.gp || 0, league);
    const recOwn = blendOwn(off.rec_ypg ?? prior.rec, prior.rec, off.gp || 0, league);
    const ownTot = rushOwn + recOwn;
    const ratio = ownTot ? rushOwn / ownTot : 0.42;
    const allowed = defn.yards_allowed_pg ?? prior.allowed;
    const matchup = 0.5 * ownTot + 0.5 * allowed;
    const fromPts = pts * (league === "nfl" ? 14.2 : 15.4);
    let expected = 0.52 * matchup + 0.48 * fromPts;
    const script = clamp(scriptMargin / 28, -0.14, 0.14);
    return [expected * ratio * (1 + script), expected * (1 - ratio) * (1 - script * 0.65)];
  }
  const [hr, hc] = side(hp, ap, homePts, Number(p.blended_margin));
  const [ar, ac] = side(ap, hp, awayPts, -Number(p.blended_margin));
  return {
    home_points: +homePts.toFixed(1), away_points: +awayPts.toFixed(1), total_points: +(homePts + awayPts).toFixed(1),
    home_rush_yds: +hr.toFixed(1), home_rec_yds: +hc.toFixed(1),
    away_rush_yds: +ar.toFixed(1), away_rec_yds: +ac.toFixed(1),
  };
}

async function poolMap(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      out[idx] = await fn(items[idx], idx);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

async function collectProps() {
  const url = "https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leaguedefaults/3?view=kona_player_info&scoringPeriodId=1";
  const filt = JSON.stringify({ players: { limit: 400, sortPercOwned: { sortPriority: 1, sortAsc: false } } });
  let payload;
  try {
    payload = await getJSON(url, { Accept: "application/json", "X-Fantasy-Filter": filt });
  } catch {
    try { payload = await getJSON(url); } catch { return []; }
  }
  const POS = { 1: "QB", 2: "RB", 3: "WR", 4: "TE", 5: "K" };
  const S = { pass_yds: "3", pass_td: "4", rush_yds: "24", rush_td: "25", rec_yds: "42", rec_td: "43", rec: "53", rush_att: "23" };
  const players = [];
  (payload.players || []).forEach((row) => {
    const pl = row.player || {};
    const pos = POS[pl.defaultPositionId];
    if (!pos || pos === "K") return;
    const week = (pl.stats || []).find((st) => st.seasonId === 2026 && st.scoringPeriodId === 1 && st.statSourceId === 1);
    const st = week?.stats || {};
    const num = (k) => Number(st[S[k]] || 0);
    players.push({
      id: pl.id, name: pl.fullName, pos, team_id: String(pl.proTeamId || ""),
      injury: pl.injuryStatus || "ACTIVE",
      pass_yds: +num("pass_yds").toFixed(1), pass_td: +num("pass_td").toFixed(2),
      rush_yds: +num("rush_yds").toFixed(1), rush_td: +num("rush_td").toFixed(2),

    });
  });
  return players;
}

function attachProps(game, players) {
  if (game.league !== "nfl") return [];
  const ids = new Set([game.home.id, game.away.id]);
  const pool = players.filter((p) => ids.has(p.team_id));
  const box = game.box || {};
  function scale(group, key, target) {
    if (!target) return;
    const s = group.reduce((a, p) => a + (p[key] || 0), 0);
    if (s <= 1) return;
    const factor = clamp(target / s, 0.78, 1.22);
    group.forEach((p) => { p[key] = +((p[key] || 0) * factor).toFixed(1); });
  }
  const home = pool.filter((p) => p.team_id === game.home.id);
  const away = pool.filter((p) => p.team_id === game.away.id);
  scale(home, "rush_yds", box.home_rush_yds);
  scale(away, "rush_yds", box.away_rush_yds);
  scale(home.filter((p) => ["WR", "TE", "RB"].includes(p.pos)), "rec_yds", box.home_rec_yds);
  scale(away.filter((p) => ["WR", "TE", "RB"].includes(p.pos)), "rec_yds", box.away_rec_yds);
  const score = (p) => p.pass_yds + p.rush_yds + p.rec_yds;
  home.sort((a, b) => score(b) - score(a));
  away.sort((a, b) => score(b) - score(a));
  const trim = (g) => [...g.filter((p) => p.pos === "QB").slice(0, 1), ...g.filter((p) => p.pos === "RB").slice(0, 3), ...g.filter((p) => p.pos === "WR" || p.pos === "TE").slice(0, 4)];
  return [
    ...trim(home).map((p) => ({ ...p, side: "home", team: game.home.abbr })),
    ...trim(away).map((p) => ({ ...p, side: "away", team: game.away.abbr })),
  ];
}

  games.forEach((g) => {
    ["home", "away"].forEach((side) => {
      const key = `${g.league}:${g[side].id}`;
      if (want.has(key)) return;
      if (g.league === "nfl" || g.odds?.home_spread != null) {
        want.add(key);
        jobs.push([g.league, g[side].id]);
      }
    });
  });
  const profiles = {};
  await poolMap(jobs.slice(0, 110), 6, async ([lg, id]) => {
    profiles[`${lg}:${id}`] = await fetchTeamProfile(lg, id);
  });
  let props = [];
  try { props = await collectProps(); } catch (e) { console.warn(e); }
  games.forEach((g) => {
    const box = projectBox(g, profiles);
    if (box) {
      g.box = box;
      g.proj.home_points = box.home_points;
      g.proj.away_points = box.away_points;
      g.proj.hashmark_total = box.total_points;
      g._wxApplied = false;
      applyWeatherToGame(g);
    }
    if (g.league === "nfl") g.props = attachProps(g, props);
  });
  const learned = learnFromFinals(games);
  games.forEach(applyLearningToGame);
  DATA.games = games;
  DATA.notes = DATA.notes || {};
  DATA.notes.learning = `Post-game residuals from ${Object.keys((DATA.residuals||{}).games_learned||{}).length} finals; remaining board shifted after each result.`;
  if (typeof renderBoard === "function") renderBoard();
  setStamp(`Live ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · learned ${learned}`, true);
  return games.length;
}

function propScore(p) {
  const pass = Number(p.pass_yds || 0);
  const rush = Number(p.rush_yds || 0);
  const rec = Number(p.rec_yds || 0);
  const td = Number(p.pass_td || 0) + Number(p.rush_td || 0) + Number(p.rec_td || 0);
  const fp = Number(p.fp != null ? p.fp : pass / 25 + (p.pass_td || 0) * 4 + rush / 10 + (p.rush_td || 0) * 6 + (p.rec || 0) * 0.5 + rec / 10 + (p.rec_td || 0) * 6);
  let s = fp * 1.15 + td * 2.4;
  if (p.injury && p.injury !== "ACTIVE") s -= 3.5;
  if (p.weather && /Rain|Snow|Shower|Thunder|Drizzle/i.test(p.weather)) {
    if (p.pos === "QB" || p.pos === "WR") s -= 1.2;
    if (p.pos === "RB") s += 0.4;
  }
  return +s.toFixed(2);
}

function collectNflProps() {
  const games = (DATA.games || []).filter((g) => g.league === "nfl");
  const out = [];
  games.forEach((g) => {
    (g.props || []).forEach((p) => {
      out.push({
        ...p,
        completed: !!g.completed,
        date: p.kick || g.date,
        game: p.game || g.short_name,
        game_id: g.id,
        indoor: g.indoor,
        weather: p.weather || (g.weather && g.weather.condition) || (g.indoor ? "Dome" : ""),
        temp_f: p.temp_f != null ? p.temp_f : (g.weather && g.weather.temp_f),
        team: p.team || (p.side === "home" ? g.home.abbr : g.away.abbr),
        opp: p.opp || (p.side === "home" ? g.away.abbr : g.home.abbr),
      });
    });
  });
  return out;
}

function sameLocalDay(iso, weekdaySet) {
  if (!iso) return false;
  const d = new Date(iso);
  return weekdaySet.has(d.getDay());
}

function renderProps() {
  if (!$("#propBoard")) return;
  const day = ($("#propDay") && $("#propDay").value) || "best";
  const pos = ($("#propPos") && $("#propPos").value) || "ALL";
  const sort = ($("#propSort") && $("#propSort").value) || "best";
  const q = (($("#propQ") && $("#propQ").value) || "").trim().toLowerCase();
  let rows = collectNflProps().filter((p) => !p.completed && p.pos !== "K");
  if (day === "best" || day === "week") {
    /* upcoming week already filtered */
  } else if (day === "thu") {
    rows = rows.filter((p) => sameLocalDay(p.date, new Set([4, 5])));
  } else if (day === "sun") {
    rows = rows.filter((p) => sameLocalDay(p.date, new Set([0])));
  } else if (day === "night") {
    rows = rows.filter((p) => {
      const d = new Date(p.date);
      const hr = d.getHours();
      return (d.getDay() === 0 && hr >= 19) || d.getDay() === 1;
    });
  }
  if (pos === "PASS") rows = rows.filter((p) => p.pos === "QB" && (p.pass_yds || 0) >= 180);
  else if (pos === "RUSH") rows = rows.filter((p) => (p.rush_yds || 0) >= 45);
  else if (pos === "REC") rows = rows.filter((p) => (p.rec_yds || 0) >= 40);
  else if (pos !== "ALL") rows = rows.filter((p) => p.pos === pos);
  if (q) {
    rows = rows.filter((p) => `${p.name} ${p.team} ${p.opp} ${p.game}`.toLowerCase().includes(q));
  }
  rows.forEach((p) => { p._score = propScore(p); p._td = Number(p.pass_td || 0) + Number(p.rush_td || 0) + Number(p.rec_td || 0); });
  rows.sort((a, b) => {
    if (sort === "fp") return (b.fp || 0) - (a.fp || 0);
    if (sort === "pass") return (b.pass_yds || 0) - (a.pass_yds || 0);
    if (sort === "rush") return (b.rush_yds || 0) - (a.rush_yds || 0);
    if (sort === "rec") return (b.rec_yds || 0) - (a.rec_yds || 0);
    if (sort === "td") return b._td - a._td;
    return b._score - a._score;
  });
  const best = day === "best" ? rows.slice(0, 18) : rows.slice(0, 48);
  const qbs = best.filter((p) => p.pos === "QB").length;
  $("#propStats").innerHTML = `
    <div class="stat"><b>${best.length}</b><span>${day === "best" ? "featured picks" : "props on this filter"}</span></div>
    <div class="stat"><b>${rows.length}</b><span>matching NFL players</span></div>
    <div class="stat"><b>${qbs}</b><span>QBs in this list</span></div>
    <div class="stat"><b>${best[0] ? best[0].name.split(" ").slice(-1)[0] : "—"}</b><span>top name right now</span></div>`;
  if (!best.length) {
    $("#propBoard").innerHTML = `<div class="empty">No NFL props in this filter. Switch the first dropdown to “Whole NFL week”.</div>`;
    return;
  }
  $("#propBoard").innerHTML = best.map((p) => {
    const line = p.pos === "QB"
      ? `${fmt.n(p.pass_yds,0)} pass · ${fmt.n(p.pass_td,1)} pass TD · ${fmt.n(p.rush_yds,0)} rush`
      : p.pos === "RB"
      ? `${fmt.n(p.rush_yds,0)} rush · ${fmt.n(p.rec,1)} rec · ${fmt.n(p.rec_yds,0)} rec yds`
      : `${fmt.n(p.rec,1)} rec · ${fmt.n(p.rec_yds,0)} yds · ${fmt.n(p.rec_td,1)} TD`;
    const inj = p.injury && p.injury !== "ACTIVE" ? `<span class="inj">${p.injury}</span>` : "";
    return `<article class="prop-card" data-id="${p.game_id}">
      <div class="who">
        <div>
          <h4>${p.name}${inj}</h4>
          <div class="prop-meta">${p.pos} · ${p.team} vs ${p.opp} · ${p.game || ""} · ${fmt.when(p.date)}</div>
        </div>
        <div class="pick-score">${p._score.toFixed(1)}</div>
      </div>
      <div class="prop-stats">
        <div><span class="lbl">Headline</span><b>${line}</b></div>
        <div><span class="lbl">Half-PPR</span><b>${fmt.n(p.fp,1)}</b></div>
        <div><span class="lbl">Weather</span><b>${p.indoor ? "Dome" : (p.weather || "—")}${p.temp_f != null && !p.indoor ? " · " + Math.round(p.temp_f) + "°" : ""}</b></div>
      </div>
    </article>`;
  }).join("");
  $$("#propBoard .prop-card").forEach((el) => el.addEventListener("click", () => openGame(el.dataset.id)));
}


function estTds(pts) {
  if (pts == null) return null;
  return +Math.max(0.4, Number(pts) / 6.85).toFixed(2);
}

function cfbPickScore(g) {
  const p = g.proj || {};
  const se = Math.abs(Number(p.edge_spread || 0));
  const te = Math.abs(Number(p.edge_total || 0));
  let s = se * 3.1 + te * 2.2 + (Number(p.confidence || 0) / 20);
  if (p.pick && p.pick !== "NO PLAY") s += 1.4;
  if (p.total_pick && p.total_pick !== "NO PLAY") s += 1.1;
  if (g.weather_impact && g.weather_impact.adj) s += Math.abs(g.weather_impact.adj) * 0.35;
  return +s.toFixed(2);
}

function renderCfbPicks() {
  if (!$("#cfbPickBoard")) return;
  const day = ($("#cfbDay") && $("#cfbDay").value) || "best";
  const market = ($("#cfbMarket") && $("#cfbMarket").value) || "mix";
  const sort = ($("#cfbSort") && $("#cfbSort").value) || "best";
  const q = (($("#cfbQ") && $("#cfbQ").value) || "").trim().toLowerCase();
  let games = (DATA.games || []).filter((g) => g.league === "cfb" && !g.completed && (g.proj || {}).hashmark_total != null);
  if (day === "thu") games = games.filter((g) => sameLocalDay(g.date, new Set([4, 5])));
  else if (day === "sat") games = games.filter((g) => sameLocalDay(g.date, new Set([6])));
  else if (day === "night") {
    games = games.filter((g) => {
      const d = new Date(g.date);
      return d.getHours() >= 19 || d.getHours() <= 1;
    });
  } else if (day === "edges") {
    games = games.filter((g) => Math.abs((g.proj || {}).edge_spread || 0) >= 1 || Math.abs((g.proj || {}).edge_total || 0) >= 1);
  }
  if (q) {
    games = games.filter((g) => `${g.name} ${g.home.abbr} ${g.away.abbr} ${g.venue || ""}`.toLowerCase().includes(q));
  }
  games.forEach((g) => { g._cfbScore = cfbPickScore(g); });
  games.sort((a, b) => {
    const pa = a.proj || {}, pb = b.proj || {};
    if (sort === "spread") return Math.abs(pb.edge_spread || 0) - Math.abs(pa.edge_spread || 0);
    if (sort === "total") return Math.abs(pb.edge_total || 0) - Math.abs(pa.edge_total || 0);
    if (sort === "conf") return (pb.confidence || 0) - (pa.confidence || 0);
    if (sort === "kick") return String(a.date || "").localeCompare(String(b.date || ""));
    return (b._cfbScore || 0) - (a._cfbScore || 0);
  });
  const list = day === "best" ? games.slice(0, 18) : games.slice(0, 40);
  const plays = list.filter((g) => (g.proj || {}).pick && g.proj.pick !== "NO PLAY").length;
  $("#cfbPickStats").innerHTML = `
    <div class="stat"><b>${list.length}</b><span>${day === "best" ? "featured CFB leans" : "games in this filter"}</span></div>
    <div class="stat"><b>${plays}</b><span>spread tickets</span></div>
    <div class="stat"><b>${list.filter((g)=>(g.proj||{}).total_pick && g.proj.total_pick!=="NO PLAY").length}</b><span>O/U tickets</span></div>
    <div class="stat"><b>${list[0] ? list[0].short_name : "—"}</b><span>top card</span></div>`;
  if (!list.length) {
    $("#cfbPickBoard").innerHTML = `<div class="empty">No college games in this filter.</div>`;
    return;
  }
  $("#cfbPickBoard").innerHTML = list.map((g) => {
    const p = g.proj || {}, o = g.odds || {};
    const awayTd = estTds(p.away_points), homeTd = estTds(p.home_points);
    const totTd = (awayTd || 0) + (homeTd || 0);
    let headline = "";
    if (market === "spread") headline = p.pick_line || p.pick || "market aligned";
    else if (market === "total") headline = p.total_pick || `Total ${p.hashmark_total ?? "—"}`;
    else if (market === "team") headline = `${g.away.abbr} ${p.away_points ?? "—"} / ${g.home.abbr} ${p.home_points ?? "—"}`;
    else if (market === "td") headline = `${g.away.abbr} ${awayTd ?? "—"} TD · ${g.home.abbr} ${homeTd ?? "—"} TD`;
    else headline = [p.pick_line || p.pick, p.total_pick].filter((x) => x && x !== "NO PLAY").join(" · ") || "market aligned";
    const wx = g.indoor ? "Dome" : ((g.weather && g.weather.condition) || "Outdoor");
    return `<article class="prop-card" data-id="${g.id}">
      <div class="who">
        <div>
          <h4>${g.away.abbr} @ ${g.home.abbr}</h4>
          <div class="prop-meta">${fmt.when(g.date)} · ${g.venue || ""} · ${wx}</div>
        </div>
        <div class="pick-score">${g._cfbScore.toFixed(1)}</div>
      </div>
      <div class="prop-stats">
        <div><span class="lbl">Lean</span><b>${headline}</b></div>
        <div><span class="lbl">Proj score</span><b>${p.away_points ?? "—"}–${p.home_points ?? "—"}</b></div>
        <div><span class="lbl">Market</span><b>${o.details || "No line"} · tot ${o.total ?? "—"}</b></div>
        <div><span class="lbl">Spread edge</span><b>${fmt.signed(p.edge_spread)}</b></div>
        <div><span class="lbl">Total edge</span><b>${fmt.signed(p.edge_total)}</b></div>
        <div><span class="lbl">Team TDs</span><b>${awayTd ?? "—"} / ${homeTd ?? "—"} <span class="subn">(~${totTd.toFixed(1)})</span></b></div>
      </div>
    </article>`;
  }).join("");
  $$("#cfbPickBoard .prop-card").forEach((el) => el.addEventListener("click", () => openGame(el.dataset.id)));
}


const NFL_DIV = {
  BUF:"AFC East", MIA:"AFC East", NE:"AFC East", NYJ:"AFC East",
  BAL:"AFC North", CIN:"AFC North", CLE:"AFC North", PIT:"AFC North",
  HOU:"AFC South", IND:"AFC South", JAX:"AFC South", TEN:"AFC South",
  DEN:"AFC West", KC:"AFC West", LV:"AFC West", LAC:"AFC West",
  DAL:"NFC East", NYG:"NFC East", PHI:"NFC East", WSH:"NFC East",
  CHI:"NFC North", DET:"NFC North", GB:"NFC North", MIN:"NFC North",
  ATL:"NFC South", CAR:"NFC South", NO:"NFC South", TB:"NFC South",
  ARI:"NFC West", LAR:"NFC West", SF:"NFC West", SEA:"NFC West"
};

const CFB_CONF_TEAMS = {
  "SEC": ["Alabama","Auburn","Arkansas","Florida","Georgia","Kentucky","LSU","Ole Miss","Mississippi State","Missouri","Oklahoma","South Carolina","Tennessee","Texas","Texas A&M","Vanderbilt"],
  "Big Ten": ["Illinois","Indiana","Iowa","Maryland","Michigan","Michigan State","Minnesota","Nebraska","Northwestern","Ohio State","Oregon","Penn State","Purdue","Rutgers","UCLA","USC","Washington","Wisconsin"],
  "ACC": ["Boston College","California","Clemson","Duke","Florida State","Georgia Tech","Louisville","Miami","NC State","North Carolina","Pittsburgh","SMU","Stanford","Syracuse","Virginia","Virginia Tech","Wake Forest"],
  "Big 12": ["Arizona","Arizona State","Baylor","BYU","Cincinnati","Colorado","Houston","Iowa State","Kansas","Kansas State","Oklahoma State","TCU","Texas Tech","UCF","Utah","West Virginia"],
  "American": ["Army","Charlotte","East Carolina","Florida Atlantic","Memphis","Navy","North Texas","Rice","South Florida","Temple","Tulane","Tulsa","UAB","UTSA"],
  "Mountain West": ["Air Force","Boise State","Colorado State","Fresno State","Hawaii","Nevada","New Mexico","San Diego State","San Jose State","UNLV","Utah State","Wyoming"],
  "Sun Belt": ["App State","Appalachian State","Arkansas State","Coastal Carolina","Georgia Southern","Georgia State","James Madison","Louisiana","Louisiana-Monroe","Marshall","Old Dominion","South Alabama","Southern Miss","Texas State","Troy","UL Monroe"],
  "MAC": ["Akron","Ball State","Bowling Green","Buffalo","Central Michigan","Eastern Michigan","Kent State","Miami (OH)","Northern Illinois","Ohio","Toledo","Western Michigan"],
  "CUSA": ["Delaware","FIU","Florida International","Jacksonville State","Kennesaw","Liberty","Louisiana Tech","Middle Tennessee","Missouri State","New Mexico State","Sam Houston","UTEP","Western Kentucky"],
  "Independent": ["Notre Dame","UConn","UMass","Connecticut","Massachusetts"]
};

function nflDiv(abbr) { return NFL_DIV[abbr] || ""; }
function nflConf(abbr) {
  const d = nflDiv(abbr);
  return d.startsWith("AFC") ? "AFC" : d.startsWith("NFC") ? "NFC" : "";
}
function cfbConf(name) {
  const n = (name || "").toLowerCase();
  for (const [conf, teams] of Object.entries(CFB_CONF_TEAMS)) {
    if (teams.some((t) => n.includes(t.toLowerCase()))) return conf;
  }
  return "Independent";
}

function wxKindMatch(g, kind) {
  const wx = g.weather || {};
  const imp = g.weather_impact || {};
  if (kind === "all") return true;
  if (kind === "dome") return !!g.indoor;
  if (kind === "outdoor") return !g.indoor;
  if (kind === "harsh") return !!(imp.harsh || (imp.adj != null && imp.adj <= -1.2));
  if (kind === "wet") return !!(imp.wet || /rain|snow|shower|drizzle|thunder/i.test(wx.condition || ""));
  if (kind === "wind") return (wx.wind_mph || 0) >= 12 || (wx.wind_gust_mph || 0) >= 20;
  if (kind === "cold") return !g.indoor && wx.temp_f != null && Number(wx.temp_f) <= 45;
  if (kind === "heat") return !g.indoor && wx.temp_f != null && Number(wx.temp_f) >= 85;
  return true;
}


function weatherEffects(g) {
  const bits = [];
  const wx = g.weather || {};
  const imp = g.weather_impact || {};
  if (g.indoor) {
    return ["Dome game: weather does not change passing, kicking, or pace."];
  }
  const wind = Number(wx.wind_mph || 0);
  const gust = Number(wx.wind_gust_mph || wind);
  const temp = wx.temp_f;
  const precip = Number(wx.precip_prob || 0);
  const inch = Number(wx.precip_in || 0);
  const cond = (wx.condition || "") + " " + (imp.note || "");
  if (gust >= 22 || wind >= 16) {
    bits.push("Wind can knock down deep balls and make field goals from 45+ a coin flip.");
    bits.push("Expect more checkdowns, shorter routes, and extra designed runs.");
  } else if (wind >= 12) {
    bits.push("A breeze is enough to trim some go-balls and fade kicks into the wind.");
  }
  if (imp.wet || precip >= 40 || inch >= 0.08 || /rain|shower|drizzle|snow|thunder/i.test(cond)) {
    bits.push("Wet ball: more short throws, screens, and between-the-tackles runs.");
    bits.push("Slips on cuts and a higher chance of dropped balls / fumbles.");
  }
  if (/snow|freezing|wintry/i.test(cond)) {
    bits.push("Snow or a slick field slows perimeter speed and red-zone timing.");
  }
  if (temp != null && temp <= 28) {
    bits.push("Bitter cold: football gets hard, kicking distance shrinks, offense can stall late.");
  } else if (temp != null && temp <= 38) {
    bits.push("Cold hands: slightly lower completion rate and fewer explosive throws.");
  } else if (temp != null && temp >= 90) {
    bits.push("Heat can slow substitutions and 4th-quarter pace, especially for the visiting sideline.");
  }
  if (/thunder|t-storm/i.test(cond)) {
    bits.push("Storm risk can delay kickoff or create a stop-start script.");
  }
  if ((imp.adj || 0) <= -1.5) {
    bits.push("Model trims the total because this mix usually means fewer points.");
  } else if (!bits.length) {
    bits.push("Pretty clean forecast: passing game and kicking should play normal.");
  }
  return bits.slice(0, 4);
}

function renderWeatherDesk(opts) {
  const { league, confSel, kindSel, qSel, statsSel, boardSel, confMode } = opts;
  const conf = (document.getElementById(confSel) || {}).value || "ALL";
  const kind = (document.getElementById(kindSel) || {}).value || "all";
  const q = ((document.getElementById(qSel) || {}).value || "").trim().toLowerCase();
  let games = (DATA.games || []).filter((g) => g.league === league && !g.completed);
  if (conf !== "ALL") {
    games = games.filter((g) => {
      if (confMode === "nfl") {
        const hd = nflDiv(g.home.abbr), ad = nflDiv(g.away.abbr);
        const hc = nflConf(g.home.abbr), ac = nflConf(g.away.abbr);
        if (conf === "AFC" || conf === "NFC") return hc === conf || ac === conf;
        return hd === conf || ad === conf;
      }
      return cfbConf(g.home.name) === conf || cfbConf(g.away.name) === conf;
    });
  }
  games = games.filter((g) => wxKindMatch(g, kind));
  if (q) {
    games = games.filter((g) =>
      `${g.name} ${g.home.name} ${g.away.name} ${g.home.abbr} ${g.away.abbr} ${g.city || ""} ${g.venue || ""}`.toLowerCase().includes(q)
    );
  }
  const sortSel = confMode === "nfl" ? "nflWxSort" : "cfbWxSort";
  const sort = (document.getElementById(sortSel) || {}).value || "tax";
  games.sort((a, b) => {
    const wa = a.weather || {}, wb = b.weather || {};
    if (sort === "wind") return (wb.wind_gust_mph || wb.wind_mph || 0) - (wa.wind_gust_mph || wa.wind_mph || 0);
    if (sort === "rain") return (wb.precip_prob || 0) - (wa.precip_prob || 0);
    if (sort === "temp") return (wa.temp_f ?? 99) - (wb.temp_f ?? 99);
    if (sort === "kick") return String(a.date || "").localeCompare(String(b.date || ""));
    return (a.proj?.weather_adj_total || 0) - (b.proj?.weather_adj_total || 0);
  });
  const harsh = games.filter((g) => (g.weather_impact || {}).harsh).length;
  const outdoor = games.filter((g) => !g.indoor).length;
  const wet = games.filter((g) => (g.weather_impact || {}).wet).length;
  document.getElementById(statsSel).innerHTML = `
    <div class="stat"><b>${games.length}</b><span>games</span></div>
    <div class="stat"><b>${outdoor}</b><span>outdoor</span></div>
    <div class="stat"><b>${wet}</b><span>wet-field leans</span></div>
    <div class="stat"><b>${harsh}</b><span>harsh forecasts</span></div>`;
  const board = document.getElementById(boardSel);
  if (!games.length) {
    board.innerHTML = `<div class="empty">No weather cards in this filter.</div>`;
    return;
  }
  board.innerHTML = games.map((g) => {
    const wx = g.weather || {};
    const imp = g.weather_impact || {};
    const p = g.proj || {};
    const label = confMode === "nfl"
      ? `${nflDiv(g.away.abbr) || ""} vs ${nflDiv(g.home.abbr) || ""}`
      : `${cfbConf(g.away.name)} @ ${cfbConf(g.home.name)}`;
    const rush = imp.rush_mult != null ? Math.round((imp.rush_mult - 1) * 100) : 0;
    const rec = imp.rec_mult != null ? Math.round((imp.rec_mult - 1) * 100) : 0;
    const script = g.indoor ? "No weather tax. Pass and rush stay on script."
      : rush > 0 || rec < 0 ? `Run leans ${rush > 0 ? "+" + rush : rush}% · passing ${rec}%`
      : rec > 0 ? `Passing environment +${rec}%`
      : "Neutral script from weather.";
    const range = (!g.indoor && (wx.temp_min_f != null || wx.temp_max_f != null))
      ? `${wx.temp_min_f != null ? Math.round(wx.temp_min_f) : "—"}° / ${wx.temp_max_f != null ? Math.round(wx.temp_max_f) : "—"}°`
      : (g.indoor ? "72° climate" : "—");
    return `<article class="prop-card" data-id="${g.id}">
      <div class="who">
        <div>
          <h4>${g.away.abbr} @ ${g.home.abbr}</h4>
          <div class="prop-meta">${fmt.when(g.date)} · ${g.city || ""} ${g.state || ""} · ${g.venue || ""} · ${label}</div>
        </div>
        <div class="pick-score">${g.indoor ? "Dome" : "wx " + fmt.signed(p.weather_adj_total)}</div>
      </div>
      <div class="prop-stats">
        <div><span class="lbl">Sky at kick</span><b>${g.indoor ? "Climate dome" : (wx.condition || "Pending")}</b></div>
        <div><span class="lbl">Kick / day range</span><b>${g.indoor ? "72°F" : (wx.temp_f != null ? Math.round(wx.temp_f) + "°F" : "—")} · ${range}</b></div>
        <div><span class="lbl">Wind / gust</span><b>${g.indoor ? "0 / 0" : `${fmt.n(wx.wind_mph,0)} / ${fmt.n(wx.wind_gust_mph,0)} mph`}</b></div>
        <div><span class="lbl">Precip kick / day</span><b>${g.indoor ? "0% · 0\"" : `${wx.precip_prob ?? "—"}% · ${fmt.n(wx.precip_in,2)}" kick · ${fmt.n(wx.precip_day_in,2)}" day`}</b></div>
        <div><span class="lbl">Humidity</span><b>${g.indoor ? "ctrl" : (wx.humidity != null ? wx.humidity + "%" : "—")}</b></div>
        <div><span class="lbl">Total after wx</span><b>${p.hashmark_total ?? "—"} <span class="subn">mkt ${ (g.odds||{}).total ?? "—"}</span></b></div>
        <div><span class="lbl">Pass / run tilt</span><b>${script}</b></div>
        <div><span class="lbl">Score split</span><b>${p.away_points ?? "—"}–${p.home_points ?? "—"}</b></div>
        <div><span class="lbl">Why</span><b>${(imp.note || "Benign setup.").slice(0, 110)}</b></div>
        <div style="grid-column:1/-1"><span class="lbl">What it may do in the game</span><b>${weatherEffects(g).map((t)=>"• "+t).join("<br>")}</b></div>
      </div>
    </article>`;
  }).join("");
  board.querySelectorAll(".prop-card").forEach((el) => el.addEventListener("click", () => openGame(el.dataset.id)));
}

function renderNflWeather() {
  if (!document.getElementById("nflWxBoard")) return;
  renderWeatherDesk({
    league: "nfl", confSel: "nflWxConf", kindSel: "nflWxKind", qSel: "nflWxQ",
    statsSel: "nflWxStats", boardSel: "nflWxBoard", confMode: "nfl"
  });
}
function renderCfbWeather() {
  if (!document.getElementById("cfbWxBoard")) return;
  renderWeatherDesk({
    league: "cfb", confSel: "cfbWxConf", kindSel: "cfbWxKind", qSel: "cfbWxQ",
    statsSel: "cfbWxStats", boardSel: "cfbWxBoard", confMode: "cfb"
  });
}

function setView(next) {
  view = next;
  if (next === "cfb" && $("#openOnly").value === "upcoming") {
    $("#openOnly").value = "projected";
  }
  $$(".tab").forEach((t) => t.classList.toggle("active", t.dataset.view === next));
  const board = next === "nfl" || next === "cfb" || next === "all";
  $("#boardSection").style.display = board ? "" : "none";
  $("#propsSection").style.display = next === "props" ? "" : "none";
  $("#cfbPicksSection").style.display = next === "cfbpicks" ? "" : "none";
  $("#nflWxSection").style.display = next === "nflwx" ? "" : "none";
  $("#cfbWxSection").style.display = next === "cfbwx" ? "" : "none";
  $("#ratingsSection").style.display = next === "ratings" ? "" : "none";
  $("#modelSection").style.display = next === "model" ? "" : "none";
  if (board) renderBoard();
  if (next === "props") renderProps();
  if (next === "cfbpicks") renderCfbPicks();
  if (next === "nflwx") renderNflWeather();
  if (next === "cfbwx") renderCfbWeather();
  if (next === "ratings") renderRatings();
  if (next === "model") renderModel();
}

async function boot() {
  if (window.HASHMARK) {
    DATA = window.HASHMARK;
  } else {
    const paths = ["snapshot.json", "./snapshot.json", "../data/snapshot.json", "/data/snapshot.json"];
    let lastErr = null;
    for (const p of paths) {
      try {
        const res = await fetch(p);
        if (res.ok) {
          DATA = await res.json();
          lastErr = null;
          break;
        }
      } catch (err) {
        lastErr = err;
      }
    }
    if (!DATA) throw lastErr || new Error("snapshot.json not found");
  }
  $("#stamp").textContent = `Snapshot ${fmt.when(DATA.generated_at)}`;
  $$(".tab").forEach((t) => t.addEventListener("click", () => setView(t.dataset.view)));
  $("#q").addEventListener("input", renderBoard);
  $("#openOnly").addEventListener("change", renderBoard);
  $("#sortKey").addEventListener("change", () => { sortKey = $("#sortKey").value; renderBoard(); });
  $("#ratingLeague").addEventListener("change", renderRatings);
  ["propDay","propPos","propSort"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", renderProps);
  });
  const pq = document.getElementById("propQ");
  if (pq) pq.addEventListener("input", renderProps);
  ["cfbDay","cfbMarket","cfbSort"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", renderCfbPicks);
  });
  const cq = document.getElementById("cfbQ");
  if (cq) cq.addEventListener("input", renderCfbPicks);
  ["nflWxConf","nflWxKind","nflWxSort"].forEach((id) => document.getElementById(id)?.addEventListener("change", renderNflWeather));
  document.getElementById("nflWxQ")?.addEventListener("input", renderNflWeather);
  ["cfbWxConf","cfbWxKind","cfbWxSort"].forEach((id) => document.getElementById(id)?.addEventListener("change", renderCfbWeather));
  document.getElementById("cfbWxQ")?.addEventListener("input", renderCfbWeather);
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
  setView("nfl");
  const fromFile = location.protocol === "file:";
  const doWx = async () => {
    try {
      setStamp("Loading stadium forecasts…", true);
      await attachWeather(DATA.games || []);
      if (typeof renderBoard === "function") renderBoard();
      setStamp(`Weather ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`, true);
    } catch (err) {
      console.warn(err);
      setStamp(`Snapshot ${fmt.when(DATA.generated_at)}`);
    }
  };
  try {
    const learn = window.learnFromFinals || learnFromFinals;
    const apply = window.applyLearningToGame || applyLearningToGame;
    const n = typeof learn === "function" ? learn(DATA.games || []) : 0;
    if (typeof apply === "function") (DATA.games || []).forEach(apply);
    if (typeof renderBoard === "function") renderBoard();
    if (n) setStamp(`Learned ${n} finals`, true);
  } catch (e) { console.warn(e); }
  if (typeof attachWeather === "function") doWx();
  $("#refreshBtn")?.addEventListener("click", () => {
    if (fromFile) { doWx(); return; }
    if (typeof liveRefresh === "function") {
      liveRefresh().catch((err) => {
        console.warn(err);
        doWx();
      });
    } else doWx();
  });
  if (!fromFile && typeof liveRefresh === "function") {
    liveRefresh().catch((err) => {
      console.warn(err);
      $("#stamp").textContent = `Snapshot ${fmt.when(DATA.generated_at)}`;
    });
  }
}

boot().catch((err) => {
  $("#board").innerHTML = `<div class="empty">Could not load snapshot.json. Run <code>python3 refresh.py</code> then serve the folder.<br>${err}</div>`;
});
</script>
